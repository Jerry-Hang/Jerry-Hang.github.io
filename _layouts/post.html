<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} · {{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { color-scheme: light dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      padding: 5rem 1.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1e1b4b;
      background: linear-gradient(135deg, #ede9fe 0%, #dbeafe 50%, #e0e7ff 100%);
      background-attachment: fixed;
    }
    .blob { position: fixed; border-radius: 9999px; filter: blur(90px); opacity: .55; pointer-events: none; z-index: -1; }
    .blob-1 { width: 420px; height: 420px; top: -90px; left: -90px; background: #a5b4fc; }
    .blob-2 { width: 520px; height: 520px; top: 34%; right: -150px; background: #c4b5fd; }
    .blob-3 { width: 380px; height: 380px; bottom: -70px; left: 22%; background: #93c5fd; }
    .hero-title { font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 800; letter-spacing: -.03em; line-height: 1.08; }
    .muted { opacity: .68; }

    /* Win11 毛玻璃卡片 + 正文排版 */
    .glass {
      background: rgba(255, 255, 255, .2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, .5);
      border-radius: 1rem;
      box-shadow: 0 8px 32px rgba(31, 38, 135, .08);
      padding: 2rem;
    }
    .post-content { line-height: 1.8; }
    .post-content h1, .post-content h2, .post-content h3 { font-weight: 700; margin: 1.6em 0 .55em; line-height: 1.3; }
    .post-content h1 { font-size: 1.6rem; } .post-content h2 { font-size: 1.35rem; } .post-content h3 { font-size: 1.15rem; }
    .post-content p { margin: 1em 0; }
    .post-content a { color: #6d28d9; text-decoration: underline; text-underline-offset: 3px; }
    .post-content code { background: rgba(0, 0, 0, .07); padding: .16em .4em; border-radius: .35em; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .88em; }
    .post-content pre { overflow-x: auto; padding: 1rem; border-radius: 1rem; background: rgba(0, 0, 0, .08); margin: 1.2em 0; }
    .post-content blockquote { border-left: 3px solid rgba(109, 40, 217, .5); padding-left: 1rem; margin: 1.2em 0; opacity: .85; }

    /* 暗黑模式 */
    @media (prefers-color-scheme: dark) {
      body { color: #e5e7eb; background: linear-gradient(135deg, #111827 0%, #1f2937 50%, #0f172a 100%); }
      .blob-1 { background: #4c1d95; opacity: .32; } .blob-2 { background: #312e81; opacity: .32; } .blob-3 { background: #0e7490; opacity: .32; }
      .glass { background: rgba(255, 255, 255, .06); border-color: rgba(255, 255, 255, .12); box-shadow: 0 8px 32px rgba(0, 0, 0, .35); }
      .post-content a { color: #a5b4fc; }
      .post-content code { background: rgba(255, 255, 255, .1); }
      .post-content pre { background: rgba(0, 0, 0, .4); }
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <main class="mx-auto max-w-3xl">
    <a href="{{ '/' | relative_url }}" class="muted mb-10 inline-flex items-center gap-1.5 text-sm transition hover:opacity-100">← 返回首页</a>
    <header class="mb-8">
      <h1 class="hero-title">{{ page.title }}</h1>
      <time class="muted mt-4 block text-sm tabular-nums">{{ page.date | date: "%Y-%m-%d" }}</time>
    </header>
    <article class="glass post-content">{{ content }}</article>
  </main>
</body>
</html>
