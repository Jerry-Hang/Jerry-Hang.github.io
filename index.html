<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jerry 的赛博博客</title>
<meta name="description" content="记录赛博修仙日常">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23007aff'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='sans-serif'%3EJ%3C/text%3E%3C/svg%3E">
<style>
/* ========== iOS 系统色板 ========== */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --accent: #007aff;
  --accent-soft: rgba(0,122,255,.12);

  --bg: #f2f2f7;
  --card: #ffffff;
  --card-border: rgba(60,60,67,.12);
  --text: #111114;
  --text-soft: rgba(60,60,67,.62);
  --text-faint: rgba(60,60,67,.38);

  --bar-bg: rgba(249,249,251,.72);
  --pill-bg: rgba(255,255,255,.92);
  --pill-hover: rgba(0,122,255,.08);

  --shadow-s: 0 1px 2px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.05);
  --shadow-m: 0 2px 6px rgba(0,0,0,.05), 0 10px 30px rgba(0,0,0,.09);
  --shadow-l: 0 18px 50px rgba(0,0,0,.18);
}
body.dark {
  --accent: #0a84ff;
  --accent-soft: rgba(10,132,255,.16);

  --bg: #000000;
  --card: #1c1c1e;
  --card-border: rgba(255,255,255,.10);
  --text: #f5f5f7;
  --text-soft: rgba(235,235,245,.60);
  --text-faint: rgba(235,235,245,.36);

  --bar-bg: rgba(28,28,30,.72);
  --pill-bg: rgba(44,44,46,.92);
  --pill-hover: rgba(10,132,255,.16);

  --shadow-s: 0 1px 2px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.4);
  --shadow-m: 0 2px 6px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.5);
  --shadow-l: 0 18px 50px rgba(0,0,0,.7);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
  transition: background .35s ease, color .35s ease;
}
button { font-family: inherit; border: 0; background: none; color: inherit; cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
::selection { background: rgba(0,122,255,.22); }
input { font-family: inherit; }

/* ========== 顶栏（毛玻璃） ========== */
.icon-btn {
  width: 40px; height: 40px; border-radius: 999px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-soft);
  transition: background .18s ease, color .18s ease, transform .12s ease;
}
.icon-btn:hover { background: var(--accent-soft); color: var(--accent); }
.icon-btn:active { transform: scale(.88); }
.icon-btn svg { width: 17px; height: 17px; }
.top-area {
  position: sticky; top: 0; z-index: 60;
  background: var(--bar-bg);
  backdrop-filter: blur(24px) saturate(1.8);
  -webkit-backdrop-filter: blur(24px) saturate(1.8);
  border-bottom: 1px solid var(--card-border);
  transition: width .38s cubic-bezier(.25,.8,.25,1), margin .38s cubic-bezier(.25,.8,.25,1),
              border-radius .38s ease, box-shadow .38s ease;
}
.top-area.compact {
  width: min(92vw, 400px);
  margin: 10px auto 0;
  border-radius: 999px;
  border-bottom-color: transparent;
  box-shadow: var(--shadow-m);
}
.top-area.compact #topbar { height: 44px; }
.top-area .tabbar { max-height: 48px; opacity: 1; overflow: hidden; transition: max-height .32s ease, opacity .24s ease, padding .32s ease; }
.top-area.compact .tabbar { max-height: 0; opacity: 0; padding-top: 0; padding-bottom: 0; }
#topbar {
  display: flex; align-items: center; justify-content: space-between;
  height: 52px; padding: 0 12px;
}
#tb-brand { display: flex; flex-direction: column; align-items: center; gap: 1px; margin: 0 auto; }
#tb-brand b { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
#tb-brand span { font-size: 11px; color: var(--text-faint); }
#tb-theme svg { width: 16px; height: 16px; }
.tabbar {
  display: flex; align-items: center; justify-content: center; gap: 34px;
  padding: 2px 0 12px;
}
.tabbar button {
  position: relative; padding: 5px 2px;
  font-size: 14px; font-weight: 500; letter-spacing: .02em;
  color: var(--text-faint);
  transition: color .18s ease;
}
.tabbar button::after {
  content: ""; position: absolute; left: 50%; bottom: -2px; transform: translateX(-50%);
  width: 0; height: 3px; border-radius: 3px; background: var(--accent);
  transition: width .22s cubic-bezier(.2,.9,.3,1.3);
}
.tabbar button.on { color: var(--text); }
.tabbar button.on::after { width: 22px; }
#tb-theme .i-sun { display: none; }
body.dark #tb-theme .i-moon { display: none; }
body.dark #tb-theme .i-sun { display: block; }

/* ========== 布局 ========== */
#layout { display: flex; min-height: calc(100vh - 52px); }
#sidebar {
  position: relative; flex: 0 0 10%;
  min-width: 56px; max-width: 520px;
  margin: 12px 16px 16px 12px;
  border-radius: 24px;
  min-height: calc(100vh - 128px);
  transition: flex-basis .45s cubic-bezier(.25,.8,.25,1), border-radius .45s ease;
  background: var(--bar-bg);
  backdrop-filter: blur(24px) saturate(1.8);
  -webkit-backdrop-filter: blur(24px) saturate(1.8);
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow-m);
  overflow: hidden;
  display: flex; flex-direction: column;
}
#layout.side-open #sidebar { flex-basis: 40%; }
#content { flex: 1 1 auto; min-width: 0; }

/* 收起态把手 */
#side-grip {
  position: absolute; inset: 0; z-index: 5;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  padding-top: 24px;
  writing-mode: vertical-rl; letter-spacing: .5em;
  font-size: 12px; font-weight: 500; color: var(--text-faint);
  background: inherit;
  transition: opacity .2s ease, color .2s ease;
}
#layout.side-open #side-grip { opacity: 0; pointer-events: none; }
#side-grip:hover { color: var(--accent); }

/* 侧栏面板 */
#side-panel { display: flex; flex-direction: column; height: 100%; width: 100%; opacity: 0; pointer-events: none; transition: opacity .25s ease; }
#layout.side-open #side-panel { opacity: 1; pointer-events: auto; }
.side-head { padding: 14px 16px 8px; }
.side-search-box { position: relative; }
.side-search-box .s-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-faint); pointer-events: none; }
#side-search {
  width: 100%; height: 38px; border-radius: 10px;
  padding: 0 12px 0 34px; font-size: 13.5px;
  background: var(--card); border: 1px solid var(--card-border);
  box-shadow: var(--shadow-s); outline: none; color: var(--text);
  transition: box-shadow .2s, border-color .2s;
  appearance: none; -webkit-appearance: none;
}
#side-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
#side-search::placeholder { color: var(--text-faint); }
input[type="search"]::-webkit-search-cancel-button { display: none; }
.side-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 8px; }
.side-chips .chip {
  padding: 5px 13px; border-radius: 999px; font-size: 12px; font-weight: 500;
  color: var(--text-soft); background: var(--card); border: 0;
  transition: background .18s ease, color .18s ease, transform .12s ease;
}
.side-chips .chip:hover { background: var(--accent-soft); color: var(--accent); }
.side-chips .chip.on { background: var(--accent); color: #fff; }
.side-label {
  padding: 4px 20px 8px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
  color: var(--text-faint);
  display: flex; align-items: center; justify-content: space-between;
}
.side-label em { font-style: normal; font-weight: 500; }
#post-scroll { flex: 1; overflow-y: auto; padding: 2px 14px 20px; overscroll-behavior: contain; }
#post-scroll::-webkit-scrollbar { width: 6px; }
#post-scroll::-webkit-scrollbar-thumb { background: rgba(120,125,135,.28); border-radius: 8px; }

/* ========== 胶囊 ========== */
.pill-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.pill-wrap { perspective: 700px; }
.pill {
  width: 100%; text-align: left;
  aspect-ratio: 4 / 3;
  display: flex; flex-direction: column; align-items: stretch; justify-content: space-between;
  padding: 12px 13px 10px;
  border-radius: 18px;
  background: var(--pill-bg);
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow-s);
  transition: transform .3s cubic-bezier(.2,.9,.3,1.3), box-shadow .3s ease, background .3s ease;
  transform-origin: left center;
  overflow: hidden;
}
.pill-wrap:hover .pill { animation: wiggle .5s ease; }
@keyframes wiggle {
  0%   { transform: rotate(0deg) translateX(0); }
  25%  { transform: rotate(-.8deg) translateX(-1px); }
  50%  { transform: rotate(.7deg)  translateX(1px); }
  75%  { transform: rotate(-.5deg) translateX(-.5px); }
  100% { transform: rotate(0deg) translateX(0); }
}
.pill .p-date {
  align-self: flex-start; padding: 2px 8px; border-radius: 999px;
  font-size: 9.5px; font-weight: 600; color: var(--accent);
  background: var(--accent-soft); white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.pill .p-title {
  font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.45;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  margin: 4px 0 6px;
  letter-spacing: -.005em;
}
.pill .p-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: auto; }
.pill .p-words { font-size: 10px; font-weight: 500; color: var(--text-faint); font-variant-numeric: tabular-nums; margin-left: auto; }
.pill .p-tag {
  font-size: 9.5px; font-weight: 500; color: var(--text-soft);
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 999px; padding: 1px 8px; white-space: nowrap; max-width: 92px; overflow: hidden; text-overflow: ellipsis;
}
.pill.selected {
  background: var(--accent);
  border-color: transparent;
  transform: perspective(700px) translateX(3px) scale(1.05) rotateY(-3deg);
  box-shadow: 0 10px 24px rgba(0,122,255,.28);
  animation: none;
}
.pill.selected .p-date { background: rgba(255,255,255,.2); color: #fff; }
.pill.selected .p-title { color: #fff; }
.pill.selected .p-tag { background: rgba(255,255,255,.16); color: #fff; border-color: transparent; }
.pill.selected .p-words { color: rgba(255,255,255,.75); }
.pill.pressing {
  transform: perspective(700px) translateY(-3px) scale(1.1) rotateY(-6deg);
  box-shadow: 0 14px 32px rgba(0,122,255,.32);
}
.empty-tip { text-align: center; color: var(--text-faint); font-size: 12.5px; padding: 28px 8px; }

/* ========== 内容区 ========== */
.view { display: none; padding: 30px 32px 44px; max-width: 860px; margin: 0 auto; }
.view.on { display: block; animation: fadeUp .35s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.view h1.hero { font-size: 24px; font-weight: 700; letter-spacing: -.015em; margin-bottom: 4px; }
.view .hero-sub { color: var(--text-soft); font-size: 13px; font-weight: 400; margin-bottom: 24px; }

/* 精选卡片 */
.pin-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 28px; }
.pin-card {
  position: relative; text-align: left;
  padding: 20px 20px 16px;
  border-radius: 16px;
  background: var(--card);
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow-s);
  transition: transform .25s cubic-bezier(.2,.9,.3,1.3), box-shadow .25s ease;
  overflow: hidden;
}
.pin-card:hover { transform: translateY(-2px) scale(1.01); box-shadow: var(--shadow-m); }
.pin-card .pc-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.pin-card .pc-date { font-size: 11px; color: var(--text-faint); font-weight: 500; font-variant-numeric: tabular-nums; }
.pin-card h3 { font-size: 16px; font-weight: 650; line-height: 1.4; margin-bottom: 8px; letter-spacing: -.01em; }
.pin-card p { font-size: 12.5px; line-height: 1.7; color: var(--text-soft); margin-bottom: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.pin-card .pc-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.cat-tag, .tag {
  display: inline-block; font-size: 10.5px; padding: 2px 9px; border-radius: 999px;
  font-weight: 500; background: var(--accent-soft); color: var(--accent);
}
.cat-tag { background: var(--card); color: var(--text-soft); border: 1px solid var(--card-border); }
.pin-card .pc-more { margin-left: auto; font-size: 12px; font-weight: 550; color: var(--text-faint); transition: color .15s; }
.pin-card:hover .pc-more { color: var(--accent); }

/* 翻页器 */
.pager { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 6px 0 2px; }
.pg-btn {
  min-width: 36px; height: 34px; padding: 0 13px; border-radius: 999px;
  font-size: 13px; font-weight: 500; color: var(--text-soft);
  background: transparent; border: 0;
  transition: background .15s ease, color .15s ease, opacity .15s ease;
}
.pg-btn:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent); }
.pg-btn:disabled { opacity: .3; cursor: not-allowed; }
.pg-info { font-size: 12.5px; font-weight: 500; color: var(--text-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pg-info b { color: var(--text); font-weight: 650; }
.pg-input {
  width: 46px; height: 34px; border-radius: 12px; text-align: center;
  font-size: 14px; font-weight: 500; color: var(--text);
  background: var(--card); border: 1px solid var(--card-border); outline: none;
  font-variant-numeric: tabular-nums;
}
.pg-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

/* 阅读 */
.reader-head { margin-bottom: 22px; }
.reader-head .r-cats { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.reader-head h1 { font-size: clamp(21px, 4.4vw, 29px); font-weight: 700; line-height: 1.32; letter-spacing: -.015em; }
.reader-head .r-meta { display: flex; gap: 10px; align-items: center; margin-top: 12px; color: var(--text-faint); font-size: 12.5px; font-weight: 500; font-variant-numeric: tabular-nums; }
.md-body { line-height: 1.9; font-size: 15px; }
.md-body h1, .md-body h2, .md-body h3, .md-body h4 { font-weight: 700; margin: 1.5em 0 .5em; line-height: 1.35; letter-spacing: -.01em; }
.md-body h1 { font-size: 1.42em; } .md-body h2 { font-size: 1.26em; } .md-body h3 { font-size: 1.1em; }
.md-body p { margin: .85em 0; }
.md-body a { text-decoration: underline; text-underline-offset: 3px; }
.md-body code { background: var(--accent-soft); color: var(--accent); padding: .14em .42em; border-radius: 6px; font-family: var(--font-mono); font-size: .86em; }
.md-body pre { background: #111111; color: #f2f2f7; border-radius: 12px; padding: 16px 18px; overflow-x: auto; margin: 1.2em 0; font-size: 13px; line-height: 1.65; }
.md-body pre code { background: none; color: inherit; padding: 0; }
.md-body blockquote { border-left: 3px solid var(--accent); padding: 2px 0 2px 16px; margin: 1.2em 0; color: var(--text-soft); }
.md-body ul, .md-body ol { margin: .9em 0; padding-left: 1.5em; }
.md-body li { margin: .35em 0; }
.md-body hr { border: 0; height: 1px; background: var(--card-border); margin: 1.8em 0; }
.md-body img { border-radius: 12px; margin: 1em 0; }
.md-body table { border-collapse: collapse; margin: 1.2em 0; width: 100%; font-size: 13.5px; }
.md-body th, .md-body td { border: 1px solid var(--card-border); padding: 8px 12px; text-align: left; }
.md-body th { background: var(--accent-soft); font-weight: 600; }
.reader-foot { display: flex; gap: 8px; margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--card-border); }
.pn-btn { flex: 1; padding: 11px 14px; border-radius: 11px; font-size: 12.5px; font-weight: 500; color: var(--text-soft); background: var(--card); border: 1px solid var(--card-border); box-shadow: var(--shadow-s); text-align: center; transition: all .15s; }
.pn-btn:hover:not(.disabled) { color: var(--accent); border-color: var(--accent); }
.pn-btn.disabled { opacity: .3; pointer-events: none; }

/* 归档 */
.arch-year { margin: 26px 0 8px; display: flex; align-items: center; gap: 10px; }
.arch-year h2 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.arch-year .count { font-size: 11px; font-weight: 500; color: var(--text-faint); background: var(--card); border: 1px solid var(--card-border); padding: 2px 10px; border-radius: 999px; }
.arch-list { display: flex; flex-direction: column; }
.arch-item { display: flex; align-items: center; gap: 14px; padding: 12px 4px; border-bottom: 1px solid var(--card-border); text-align: left; width: 100%; transition: padding-left .15s; }
.arch-item:hover { padding-left: 10px; }
.arch-item .a-date { font-size: 12px; font-weight: 500; color: var(--text-faint); font-variant-numeric: tabular-nums; width: 84px; flex-shrink: 0; }
.arch-item .a-title { font-size: 14px; font-weight: 550; color: var(--text); flex: 1; }

/* 关于 */
.about-card { padding: 26px; border-radius: 18px; background: var(--card); border: 1px solid var(--card-border); box-shadow: var(--shadow-s); }
.about-card .a-hero { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
.about-card .avatar { width: 60px; height: 60px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 600; color: #fff; background: var(--accent); box-shadow: var(--shadow-m); }
.about-card .a-hero h2 { font-size: 18px; font-weight: 700; }
.about-card .a-hero p { font-size: 12.5px; color: var(--text-soft); margin-top: 3px; }
.about-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin: 18px 0; }
.stat { padding: 14px 8px; border-radius: 12px; text-align: center; background: var(--bg); border: 1px solid var(--card-border); }
.stat b { display: block; font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--text-faint); }
.about-card .a-links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.link-btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border-radius: 10px; font-size: 12.5px; font-weight: 500; color: var(--text); background: var(--bg); border: 1px solid var(--card-border); transition: all .15s; }
.link-btn:hover { color: var(--accent); border-color: var(--accent); }

/* ========== 移动端（侧栏滑出抽屉） ========== */
#scrim { position: fixed; inset: 0; z-index: 78; background: rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .3s; }
body.m-side-open #scrim { opacity: 1; pointer-events: auto; }
@media (max-width: 720px) {
  #layout { display: block; }
  #sidebar {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 80;
    flex: none !important; width: min(84vw, 336px); max-width: none;
    margin: 10px; border-radius: 26px; min-height: 0;
    transform: translateX(-104%);
    transition: transform .32s cubic-bezier(.25,.8,.25,1);
    box-shadow: var(--shadow-l);
  }
  body.m-side-open #sidebar { transform: translateX(0); }
  #side-grip { display: none; }
  #side-panel { opacity: 1 !important; pointer-events: auto !important; }
  .side-head { padding: 12px 12px 8px; }
  .side-chips { padding: 0 12px 6px; }
  #post-scroll { padding: 2px 12px 18px; }
  .pin-grid { grid-template-columns: 1fr; }
  .pill-grid { grid-template-columns: 1fr; }
  .view { padding: 20px 16px 32px; }
  #tb-brand span { display: none; }
  .arch-item .a-date { width: 70px; }
  .about-stats { grid-template-columns: repeat(2,1fr); }
}
</style>
</head>
<body>

<div class="top-area">
  <header id="topbar">
    <button class="icon-btn" id="tb-side-btn" aria-label="目录">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div id="tb-brand">
      <b>Jerry 的赛博博客</b>
      <span>记录赛博修仙日常</span>
    </div>
    <button class="icon-btn" id="tb-theme" aria-label="切换外观">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>
  <div class="tabbar">
    <button data-nav="home" class="on">主页</button>
    <button data-nav="archive">归档</button>
    <button data-nav="about">关于</button>
  </div>
</div>

<div id="layout">
  <aside id="sidebar">
    <div id="side-grip">目录</div>
    <div id="side-panel">
      <div class="side-head">
        <div class="side-search-box">
          <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
          <input id="side-search" type="search" placeholder="搜索" autocomplete="off">
        </div>
      </div>
      <div class="side-chips" id="side-chips"></div>
      <div class="side-label"><span>最新文章</span><em id="side-count"></em></div>
      <div id="post-scroll"></div>
    </div>
  </aside>

  <div id="content">
    <section class="view" id="view-home">
      <h1 class="hero">精选</h1>
      <p class="hero-sub">置顶文章，固定在第一页。</p>
      <div class="pin-grid" id="pin-grid"></div>
      <div class="pager" id="pager-home"></div>
    </section>

    <section class="view" id="view-reader">
      <div class="reader-head">
        <div class="r-cats" id="r-cats"></div>
        <h1 id="r-title"></h1>
        <div class="r-meta" id="r-meta"></div>
      </div>
      <div class="md-body" id="r-body"></div>
      <div class="reader-foot" id="r-foot"></div>
    </section>

    <section class="view" id="view-archive">
      <h1 class="hero">归档</h1>
      <p class="hero-sub">全部文章，按时间倒序。</p>
      <div id="arch-body"></div>
    </section>

    <section class="view" id="view-about">
      <h1 class="hero">关于</h1>
      <p class="hero-sub">赛博修仙，从记录开始。</p>
      <div class="about-card" id="about-body"></div>
    </section>
  </div>
</div>

<div id="scrim"></div>
<script src="app.js"></script>
</body>
</html>
