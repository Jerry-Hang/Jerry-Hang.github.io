<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jerry 的赛博博客</title>
<meta name="description" content="记录赛博修仙日常">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230078ff'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif'%3EJ%3C/text%3E%3C/svg%3E">
<style>
/* ================= 基础变量 ================= */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;

  --radius-window: 16px;
  --radius-big: 24px;
  --menu-h: 30px;
  --taskbar-h: 52px;

  --accent: #4f7cff;
  --accent-2: #8b5cf6;

  --glass-bg: rgba(255,255,255,.55);
  --glass-bg-strong: rgba(255,255,255,.72);
  --glass-border: rgba(255,255,255,.65);
  --glass-shadow: 0 8px 32px rgba(31,38,135,.12);
  --text: #16213e;
  --text-soft: rgba(22,33,62,.6);
  --text-faint: rgba(22,33,62,.42);
  --win-bg: rgba(248,250,255,.82);
  --code-bg: rgba(15,23,42,.06);
  --hover: rgba(255,255,255,.45);
  --chip-bg: rgba(255,255,255,.6);
  --danger: #ff5f57;
  --warn: #febc2e;
  --ok: #28c840;
}
body.dark {
  --glass-bg: rgba(22,28,46,.55);
  --glass-bg-strong: rgba(30,38,60,.78);
  --glass-border: rgba(255,255,255,.14);
  --glass-shadow: 0 8px 32px rgba(0,0,0,.45);
  --text: #edf2ff;
  --text-soft: rgba(237,242,255,.62);
  --text-faint: rgba(237,242,255,.4);
  --win-bg: rgba(23,28,45,.86);
  --code-bg: rgba(255,255,255,.09);
  --hover: rgba(255,255,255,.08);
  --chip-bg: rgba(255,255,255,.1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  color: var(--text);
  background: #0b0e1a;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
button { font-family: inherit; border: 0; background: none; color: inherit; cursor: pointer; }
img { max-width: 100%; }
::selection { background: rgba(79,124,255,.3); }
input, textarea { font-family: inherit; }

/* ================= 壁纸层 ================= */
#wallpaper {
  position: fixed; inset: 0; z-index: 0;
  background: var(--wall, linear-gradient(135deg,#7ec8ff 0%,#a78bfa 50%,#f0abfc 100%));
  transition: background .8s ease;
}
#wallpaper::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(1200px 700px at 15% 10%, rgba(255,255,255,.35), transparent 60%),
              radial-gradient(900px 600px at 85% 80%, rgba(255,255,255,.28), transparent 60%),
              radial-gradient(700px 500px at 60% 30%, rgba(255,255,255,.16), transparent 55%);
  transition: opacity .8s ease;
}
body.dark #wallpaper::after { opacity: .25; }
body.dark #wallpaper { filter: saturate(.9) brightness(.72); }

#desktop { position: fixed; inset: 0; z-index: 1; }

/* ================= 菜单栏（macOS 风，置顶） ================= */
#menubar {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--menu-h); z-index: 500;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 10px;
  font-size: 12.5px; font-weight: 600;
  background: var(--glass-bg);
  backdrop-filter: blur(24px) saturate(1.6);
  -webkit-backdrop-filter: blur(24px) saturate(1.6);
  border-bottom: 1px solid var(--glass-border);
}
#menubar .mb-left, #menubar .mb-right { display: flex; align-items: center; gap: 2px; height: 100%; }
#menubar button.mb-item {
  height: 24px; padding: 0 9px; border-radius: 6px;
  display: flex; align-items: center; gap: 6px; color: var(--text);
  font-size: 12.5px; font-weight: 600; opacity: .92;
  transition: background .15s ease, opacity .15s ease;
}
#menubar button.mb-item:hover, #menubar button.mb-item.open { background: var(--hover); opacity: 1; }
#menubar .mb-logo { font-size: 14px; padding: 0 8px 0 6px; }
#menubar .mb-title { padding: 0 8px; font-weight: 700; }
#menubar .mb-title b { color: var(--accent); }
.mb-divider { width: 1px; height: 14px; background: var(--text-faint); margin: 0 6px; }
.mb-right { gap: 4px; }
.mb-right .mb-ic { height: 24px; padding: 0 7px; border-radius: 6px; display: flex; align-items: center; opacity: .9; }
.mb-right .mb-ic:hover { background: var(--hover); }
#mb-clock { font-variant-numeric: tabular-nums; font-weight: 700; padding: 0 8px; }
#mb-search { width: 170px; height: 22px; border-radius: 8px; padding: 0 8px; font-size: 12px;
  background: var(--hover); border: 1px solid transparent; outline: none; color: var(--text); transition: all .2s; }
#mb-search:focus { border-color: var(--accent); background: var(--glass-bg-strong); width: 220px; }
#mb-search::placeholder { color: var(--text-faint); }
@media (max-width: 720px) {
  #menubar .mb-item .label { display: none; }
  #menubar .mb-item { padding: 0 8px; }
  #mb-search { width: 110px; }
  #mb-search:focus { width: 130px; }
}

/* 下拉菜单 */
.dropdown {
  position: absolute; top: calc(var(--menu-h) + 4px); min-width: 190px; z-index: 900;
  padding: 6px; border-radius: 12px;
  background: var(--glass-bg-strong);
  backdrop-filter: blur(30px) saturate(1.7);
  -webkit-backdrop-filter: blur(30px) saturate(1.7);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  animation: pop .14s ease;
}
@keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.97); } to { opacity: 1; transform: none; } }
.dropdown button {
  display: flex; width: 100%; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: 8px; font-size: 13px; font-weight: 500; text-align: left; color: var(--text);
}
.dropdown button:hover { background: var(--hover); }
.dropdown .dd-sep { height: 1px; background: var(--glass-border); margin: 5px 8px; }
.dropdown .dd-key { margin-left: auto; font-size: 11px; color: var(--text-faint); }

/* ================= 桌面图标（iOS 风） ================= */
#desktop-icons {
  position: fixed; left: 18px; top: calc(var(--menu-h) + 16px); z-index: 10;
  display: flex; flex-direction: column; gap: 18px;
}
.dicon {
  width: 84px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  background: none; border-radius: 14px; padding: 8px 4px 6px;
  transition: transform .18s ease, background .18s ease;
}
.dicon:hover { background: rgba(255,255,255,.32); transform: scale(1.05); }
.dicon:active { transform: scale(.94); }
body.dark .dicon:hover { background: rgba(255,255,255,.12); }
.dicon .glyph {
  width: 58px; height: 58px; border-radius: 15px;
  display: flex; align-items: center; justify-content: center;
  font-size: 30px;
  background: var(--glass-bg-strong);
  backdrop-filter: blur(18px) saturate(1.5);
  -webkit-backdrop-filter: blur(18px) saturate(1.5);
  border: 1px solid var(--glass-border);
  box-shadow: 0 8px 22px rgba(20,30,60,.18), inset 0 1px 0 rgba(255,255,255,.5);
}
body.dark .dicon .glyph { box-shadow: 0 8px 22px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12); }
.dicon .lbl { font-size: 11.5px; font-weight: 600; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.55); }
body.dark .dicon .lbl { text-shadow: 0 1px 5px rgba(0,0,0,.7); }
@media (max-width: 720px) {
  #desktop-icons { flex-direction: row; flex-wrap: wrap; gap: 8px; left: 12px; top: calc(var(--menu-h) + 10px); width: calc(100% - 24px); }
  .dicon { width: 74px; padding: 4px; }
  .dicon .glyph { width: 54px; height: 54px; font-size: 27px; }
}

/* ================= 窗口系统 ================= */
#windows-layer { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
.window {
  position: absolute; pointer-events: auto;
  min-width: 320px; min-height: 200px;
  border-radius: var(--radius-window);
  background: var(--win-bg);
  backdrop-filter: blur(36px) saturate(1.5);
  -webkit-backdrop-filter: blur(36px) saturate(1.5);
  border: 1px solid var(--glass-border);
  box-shadow: 0 22px 60px rgba(15,25,60,.28), 0 2px 8px rgba(15,25,60,.08);
  display: flex; flex-direction: column;
  overflow: hidden;
  animation: winIn .22s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes winIn { from { opacity: 0; transform: scale(.94) translateY(10px); } to { opacity: 1; transform: none; } }
.window.minimized { display: none; }
.window.maximized {
  left: 8px !important; top: calc(var(--menu-h) + 8px) !important;
  width: calc(100% - 16px) !important; height: calc(100% - var(--menu-h) - var(--taskbar-h) - 24px) !important;
}
.window.inactive { opacity: .86; box-shadow: 0 12px 34px rgba(15,25,60,.14); }
.win-titlebar {
  height: 40px; flex: 0 0 40px; display: flex; align-items: center;
  padding: 0 12px; gap: 8px; cursor: default; flex-shrink: 0;
  border-bottom: 1px solid var(--glass-border);
  background: var(--glass-bg);
}
.win-titlebar.dragging { cursor: grabbing; }
.win-dots { display: flex; gap: 7px; }
.win-dot { width: 12px; height: 12px; border-radius: 50%; border: .5px solid rgba(0,0,0,.12); position: relative; }
.win-dot.close { background: var(--danger); }
.win-dot.min { background: var(--warn); }
.win-dot.max { background: var(--ok); }
.win-dots:hover .win-dot, .win-dots:hover .win-dot::before, .win-dots:hover .win-dot::after { opacity: 1; }
.win-dot::before, .win-dot::after { content:""; position:absolute; left:50%; top:50%; opacity:0; }
.win-dot.close::before, .win-dot.close::after { width:6px; height:1.4px; background: rgba(60,20,20,.75); transform: translate(-50%,-50%) rotate(45deg); }
.win-dot.close::after { transform: translate(-50%,-50%) rotate(-45deg); }
.win-dot.min::before { width:6px; height:1.4px; background: rgba(90,60,0,.75); transform: translate(-50%,-50%); }
.win-dot.max::before { width:5px; height:5px; border:1.2px solid rgba(0,70,0,.7); border-radius:1px; transform: translate(-50%,-50%); }
.win-title { flex: 1; text-align: center; font-size: 13px; font-weight: 650; color: var(--text-soft);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; }
.win-actions { display: flex; gap: 4px; }
.win-btn { width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 13px; opacity: .75; }
.win-btn:hover { background: var(--hover); opacity: 1; }
.win-body { flex: 1; overflow-y: auto; padding: 18px 22px; user-select: text; overscroll-behavior: contain; }
.win-body::-webkit-scrollbar, .start-scroll::-webkit-scrollbar { width: 8px; }
.win-body::-webkit-scrollbar-thumb, .start-scroll::-webkit-scrollbar-thumb { background: rgba(128,128,160,.4); border-radius: 8px; }
@media (max-width: 720px) {
  .window { left: 4px !important; top: calc(var(--menu-h) + 4px) !important; width: calc(100% - 8px) !important;
    height: calc(100% - var(--menu-h) - var(--taskbar-h) - 12px) !important; min-width: 0; }
  .win-body { padding: 14px 16px; }
}

/* ================= 任务栏（Win11 风，置底） ================= */
#taskbar {
  position: fixed; left: 0; right: 0; bottom: 0; height: var(--taskbar-h); z-index: 500;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 10px;
  background: var(--glass-bg);
  backdrop-filter: blur(24px) saturate(1.6);
  -webkit-backdrop-filter: blur(24px) saturate(1.6);
  border-top: 1px solid var(--glass-border);
}
.tb-btn {
  height: 38px; min-width: 38px; padding: 0 8px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 14px; color: var(--text); position: relative;
  transition: background .15s ease, transform .1s ease;
}
.tb-btn:hover { background: var(--hover); }
.tb-btn:active { transform: scale(.93); }
.tb-btn.on { background: var(--hover); }
.tb-btn .dot { position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); width: 5px; height: 5px; border-radius: 50%; background: var(--text-soft); opacity: 0; transition: opacity .2s; }
.tb-btn.on .dot { opacity: 1; }
#tb-center { display: flex; align-items: center; gap: 6px; position: absolute; left: 50%; transform: translateX(-50%); }
#tb-center .tb-btn { padding: 0 10px; font-size: 12.5px; font-weight: 600; }
.tb-right { display: flex; align-items: center; gap: 2px; }
.tb-clock { display: flex; flex-direction: column; align-items: flex-end; padding: 0 10px; border-radius: 8px; line-height: 1.25; font-size: 11.5px; font-weight: 600; }
.tb-clock:hover { background: var(--hover); }
@media (max-width: 720px) {
  #taskbar { padding: 0 6px; }
  #tb-center .label { display: none; }
  #tb-center .tb-btn { padding: 0 8px; }
  .tb-clock { font-size: 10.5px; }
  .tb-right > .tb-btn.tb-more { display: none; }
}

/* ================= 开始菜单（Win11 风） ================= */
#start-menu {
  position: fixed; left: 50%; bottom: calc(var(--taskbar-h) + 10px); transform: translateX(-50%) translateY(14px);
  width: min(560px, calc(100vw - 20px)); max-height: min(560px, calc(100vh - var(--taskbar-h) - var(--menu-h) - 30px));
  z-index: 600; opacity: 0; pointer-events: none;
  display: flex; flex-direction: column; padding: 22px;
  border-radius: var(--radius-big);
  background: var(--glass-bg-strong);
  backdrop-filter: blur(40px) saturate(1.8);
  -webkit-backdrop-filter: blur(40px) saturate(1.8);
  border: 1px solid var(--glass-border);
  box-shadow: 0 30px 80px rgba(15,25,60,.35);
  transition: opacity .18s ease, transform .22s cubic-bezier(.2,.9,.3,1.15);
}
#start-menu.open { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
.sm-title { font-size: 13px; font-weight: 700; color: var(--text-soft); margin-bottom: 12px; }
.sm-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; overflow-y: auto; padding-bottom: 12px; }
.sm-app {
  display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 14px 6px 12px; border-radius: 14px; text-align: center;
}
.sm-app:hover { background: var(--hover); }
.sm-app:active { transform: scale(.95); }
.sm-app .a-glyph { width: 46px; height: 46px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 24px;
  background: linear-gradient(135deg, rgba(255,255,255,.75), rgba(255,255,255,.4)); border: 1px solid var(--glass-border); }
body.dark .sm-app .a-glyph { background: linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.05)); }
.sm-app .a-name { font-size: 12px; font-weight: 600; }
.sm-search-row { display: flex; gap: 10px; align-items: center; margin-top: auto; }
.sm-search { flex: 1; height: 36px; border-radius: 9px; padding: 0 14px; font-size: 13px; background: var(--hover); border: 1px solid transparent; outline: none; color: var(--text); }
.sm-search:focus { border-color: var(--accent); background: var(--glass-bg-strong); }
.power { width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.power:hover { background: var(--hover); }

/* ================= 右键菜单 ================= */
#context-menu {
  position: fixed; z-index: 950; min-width: 200px; padding: 6px; border-radius: 12px;
  background: var(--glass-bg-strong);
  backdrop-filter: blur(30px) saturate(1.7);
  -webkit-backdrop-filter: blur(30px) saturate(1.7);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  display: none; animation: pop .12s ease;
}
#context-menu.open { display: block; }
#context-menu button { display: flex; width: 100%; align-items: center; gap: 9px; padding: 8px 11px; border-radius: 8px; font-size: 13px; font-weight: 500; text-align: left; }
#context-menu button:hover { background: var(--hover); }
#context-menu .sep { height: 1px; background: var(--glass-border); margin: 5px 8px; }

/* ================= 锁屏（iOS 风） ================= */
#lockscreen {
  position: fixed; inset: 0; z-index: 1000;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  color: #fff; background: #0b0e1a;
  transition: opacity .6s ease, transform .6s ease;
}
#lockscreen.hide { opacity: 0; transform: translateY(-4%) scale(1.04); pointer-events: none; }
#lockscreen .ls-time { font-size: clamp(64px, 20vw, 128px); font-weight: 200; letter-spacing: -.02em; font-variant-numeric: tabular-nums; text-shadow: 0 2px 30px rgba(0,0,0,.4); }
#lockscreen .ls-date { font-size: clamp(15px, 4vw, 20px); font-weight: 500; opacity: .9; text-shadow: 0 1px 12px rgba(0,0,0,.4); }
#lockscreen .ls-tip { position: absolute; bottom: 6vh; font-size: 13px; opacity: .75; display: flex; align-items: center; gap: 8px; animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: .95; } }
#lockscreen.hide .ls-tip { opacity: 0; }

/* ================= 开机画面（Win11 风） ================= */
#boot-screen {
  position: fixed; inset: 0; z-index: 980; background: #061021; color: #cfe0ff;
  display: none; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
}
#boot-screen.show { display: flex; }
#boot-screen .boot-logo {
  width: 96px; height: 96px; border-radius: 22px; display: flex; align-items: center; justify-content: center;
  font-size: 48px; color: #fff;
  background: linear-gradient(135deg, #0078ff, #8b5cf6);
  box-shadow: 0 0 60px rgba(0,120,255,.55), inset 0 1px 0 rgba(255,255,255,.4);
  animation: bootGlow 1.6s ease-in-out infinite alternate;
}
@keyframes bootGlow { from { box-shadow: 0 0 30px rgba(0,120,255,.3); } to { box-shadow: 0 0 90px rgba(0,120,255,.75); } }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.18); border-top-color: #fff; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#boot-screen .boot-text { font-size: 14px; letter-spacing: .5px; opacity: .85; }

/* ================= Toast ================= */
#toast {
  position: fixed; left: 50%; bottom: calc(var(--taskbar-h) + 18px); transform: translateX(-50%) translateY(16px);
  z-index: 990; padding: 10px 20px; border-radius: 12px; font-size: 13px; font-weight: 600; color: #fff;
  background: rgba(20,28,48,.88); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.14);
  opacity: 0; pointer-events: none; transition: all .25s ease;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ================= 文章列表 ================= */
.art-toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.art-search-row { display: flex; gap: 8px; }
.art-search { flex: 1; height: 38px; border-radius: 10px; padding: 0 14px; font-size: 13.5px; background: var(--hover); border: 1px solid transparent; outline: none; color: var(--text); }
.art-search:focus { border-color: var(--accent); background: var(--glass-bg-strong); }
.art-search::placeholder { color: var(--text-faint); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--text-soft); background: var(--chip-bg); border: 1px solid var(--glass-border); transition: all .15s; }
.chip:hover { background: var(--hover); }
.chip.on { background: var(--accent); color: #fff; border-color: transparent; }
.art-list { display: flex; flex-direction: column; gap: 10px; padding-bottom: 8px; }
.art-card {
  display: block; width: 100%; text-align: left; padding: 14px 16px; border-radius: 14px;
  background: var(--glass-bg); border: 1px solid var(--glass-border);
  transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
}
.art-card:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(31,38,135,.14); background: var(--glass-bg-strong); }
.art-card:active { transform: scale(.985); }
.art-card .row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.art-card .t { font-size: 15.5px; font-weight: 700; }
.art-card .d { font-size: 11.5px; color: var(--text-faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.art-card .ex { margin-top: 6px; font-size: 12.5px; color: var(--text-soft); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.art-card .meta { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tag { font-size: 11px; padding: 2px 9px; border-radius: 999px; font-weight: 600; background: var(--accent); color: #fff; opacity: .92; }
.tag.alt { background: var(--accent-2); }
.cat { font-size: 11px; padding: 2px 9px; border-radius: 999px; font-weight: 600; color: var(--text-soft); background: var(--hover); border: 1px solid var(--glass-border); }
.empty { text-align: center; padding: 34px 10px; color: var(--text-faint); font-size: 13px; }

/* ================= 阅读窗口 ================= */
.reader-head { margin-bottom: 18px; }
.reader-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 8px; }
.reader-nav .back { display: flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 9px; background: var(--hover); color: var(--text-soft); }
.reader-nav .back:hover { background: var(--glass-bg-strong); }
.reader-head h1 { font-size: clamp(20px, 4vw, 26px); font-weight: 800; letter-spacing: -.01em; line-height: 1.3; }
.reader-head .sub { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; color: var(--text-faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.md-body { line-height: 1.85; font-size: 15px; }
.md-body h1, .md-body h2, .md-body h3, .md-body h4 { font-weight: 750; margin: 1.4em 0 .5em; line-height: 1.35; }
.md-body h1 { font-size: 1.5em; } .md-body h2 { font-size: 1.3em; } .md-body h3 { font-size: 1.12em; }
.md-body p { margin: .8em 0; }
.md-body a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.md-body code { background: var(--code-bg); padding: .14em .4em; border-radius: 6px; font-family: var(--font-mono); font-size: .86em; }
.md-body pre { background: rgba(13,20,40,.9); color: #dbe7ff; border-radius: 14px; padding: 14px 16px; overflow-x: auto; margin: 1.1em 0; font-size: 13px; line-height: 1.6; }
.md-body pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
body.dark .md-body pre { background: rgba(0,0,0,.5); }
.md-body blockquote { border-left: 3px solid var(--accent); padding: 2px 0 2px 14px; margin: 1.1em 0; color: var(--text-soft); }
.md-body ul, .md-body ol { margin: .8em 0; padding-left: 1.5em; }
.md-body li { margin: .3em 0; }
.md-body hr { border: 0; height: 1px; background: var(--glass-border); margin: 1.6em 0; }
.md-body img { border-radius: 12px; margin: .8em 0; }
.md-body table { border-collapse: collapse; margin: 1em 0; width: 100%; font-size: 13.5px; }
.md-body th, .md-body td { border: 1px solid var(--glass-border); padding: 7px 11px; text-align: left; }
.md-body th { background: var(--hover); font-weight: 700; }
.reader-foot { display: flex; gap: 10px; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--glass-border); }
.pn-btn { flex: 1; padding: 10px 12px; border-radius: 11px; background: var(--hover); font-size: 12.5px; font-weight: 600; color: var(--text-soft); text-align: center; transition: all .15s; }
.pn-btn:hover { background: var(--glass-bg-strong); color: var(--text); }
.pn-btn.disabled { opacity: .35; pointer-events: none; }

/* ================= 关于 / 设置 ================= */
.about-hero { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; }
.about-avatar { width: 74px; height: 74px; border-radius: 20px; font-size: 36px; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #0078ff, #8b5cf6); color: #fff; box-shadow: 0 10px 26px rgba(0,120,255,.35); }
.about-hero h2 { font-size: 20px; font-weight: 800; }
.about-hero .sub { font-size: 12.5px; color: var(--text-soft); margin-top: 4px; }
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
.stat { padding: 13px 8px; border-radius: 14px; text-align: center; background: var(--glass-bg); border: 1px solid var(--glass-border); }
.stat b { display: block; font-size: 21px; font-weight: 800; color: var(--accent); }
.stat span { font-size: 11px; color: var(--text-faint); }
@media (max-width: 560px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
.sect { margin: 14px 0; }
.sect h3 { font-size: 12.5px; font-weight: 700; color: var(--text-faint); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 9px; }
.link-row { display: flex; gap: 8px; flex-wrap: wrap; }
.link-btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; background: var(--hover); color: var(--text); text-decoration: none; transition: all .15s; }
.link-btn:hover { background: var(--glass-bg-strong); transform: translateY(-1px); }
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 13px; background: var(--glass-bg); border: 1px solid var(--glass-border); margin-bottom: 9px; }
.setting-row .st-name { font-size: 13.5px; font-weight: 650; }
.setting-row .st-desc { font-size: 11.5px; color: var(--text-faint); margin-top: 2px; }
.swatches { display: flex; gap: 8px; }
.swatch { width: 30px; height: 30px; border-radius: 9px; border: 2px solid transparent; background-size: cover; transition: transform .15s, border-color .15s; }
.swatch:hover { transform: scale(1.12); }
.swatch.on { border-color: var(--text); }
.seg { display: flex; background: var(--hover); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { padding: 6px 13px; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--text-soft); }
.seg button.on { background: var(--glass-bg-strong); color: var(--text); box-shadow: 0 1px 6px rgba(0,0,0,.12); }
.switch { width: 42px; height: 24px; border-radius: 999px; background: rgba(128,128,150,.35); position: relative; transition: background .2s; flex-shrink: 0; }
.switch::after { content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%; background: #fff; top: 3px; left: 3px; transition: left .2s; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.switch.on { background: var(--accent); }
.switch.on::after { left: 21px; }

/* 移动端尺寸 */
@media (max-width: 720px) {
  :root { --taskbar-h: 46px; --menu-h: 28px; }
}
</style>
</head>
