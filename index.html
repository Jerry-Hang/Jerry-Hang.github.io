<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jerry 的赛博博客</title>
<meta name="description" content="记录赛博修仙日常">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230078ff'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif'%3EJ%3C/text%3E%3C/svg%3E">
<style>
/* ========== 基础 ========== */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --accent: #4f6ef7;
  --accent-soft: #eef1ff;
  --bg: #f6f7fb;
  --card: #ffffff;
  --card-border: rgba(20,30,70,.08);
  --text: #1c2440;
  --text-soft: #5b6478;
  --text-faint: #98a0b3;
  --sidebar-bg: rgba(250,251,255,.92);
  --pill-bg: #ffffff;
  --pill-border: rgba(20,30,70,.09);
  --pill-hover-bg: #f2f4ff;
  --shadow-s: 0 1px 3px rgba(30,40,80,.06);
  --shadow-m: 0 6px 20px rgba(30,40,80,.10);
  --shadow-l: 0 14px 44px rgba(30,40,80,.16);
}
body.dark {
  --bg: #0f1220;
  --card: #171a2b;
  --card-border: rgba(255,255,255,.09);
  --text: #e8ecf8;
  --text-soft: #a6aec4;
  --text-faint: #6b7390;
  --sidebar-bg: rgba(19,23,38,.94);
  --pill-bg: #1c2036;
  --pill-border: rgba(255,255,255,.10);
  --pill-hover-bg: #232946;
  --shadow-s: 0 1px 3px rgba(0,0,0,.35);
  --shadow-m: 0 6px 20px rgba(0,0,0,.45);
  --shadow-l: 0 14px 44px rgba(0,0,0,.6);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
button { font-family: inherit; border: 0; background: none; color: inherit; cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
::selection { background: rgba(79,110,247,.25); }
input { font-family: inherit; }

/* ========== 顶栏 ========== */
#topbar {
  position: sticky; top: 0; z-index: 60;
  display: flex; align-items: center; gap: 12px;
  height: 54px; padding: 0 18px;
  background: var(--sidebar-bg);
  backdrop-filter: blur(18px) saturate(1.4);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
  border-bottom: 1px solid var(--card-border);
}
#tb-side-btn {
  display: flex; align-items: center; gap: 7px;
  height: 34px; padding: 0 12px; border-radius: 10px;
  font-size: 13px; font-weight: 600; color: var(--text-soft);
  background: var(--card); border: 1px solid var(--card-border);
  box-shadow: var(--shadow-s);
  transition: all .18s ease;
}
#tb-side-btn:hover { color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow-m); }
#tb-side-btn svg { display: block; }
.tb-brand { display: flex; align-items: baseline; gap: 8px; margin-right: auto; }
.tb-brand b { font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
.tb-brand span { font-size: 12px; color: var(--text-faint); }
.tb-nav { display: flex; gap: 4px; }
.tb-nav button {
  height: 32px; padding: 0 13px; border-radius: 9px;
  font-size: 13px; font-weight: 600; color: var(--text-soft);
  transition: all .15s ease;
}
.tb-nav button:hover { background: var(--card); color: var(--text); }
.tb-nav button.on { background: var(--accent); color: #fff; }
#tb-theme { width: 34px; height: 34px; border-radius: 10px; font-size: 15px; background: var(--card); border: 1px solid var(--card-border); box-shadow: var(--shadow-s); transition: all .15s; }
#tb-theme:hover { transform: translateY(-1px); }

/* ========== 布局骨架 ========== */
#layout { display: flex; min-height: calc(100vh - 54px); }
#sidebar {
  position: relative; flex: 0 0 10%;
  min-width: 64px; max-width: 520px;
  transition: flex-basis .45s cubic-bezier(.25,.8,.25,1);
  background: var(--sidebar-bg);
  border-right: 1px solid var(--card-border);
  overflow: hidden;
  display: flex; flex-direction: column;
}
#layout.side-open #sidebar { flex-basis: 40%; }
#content { flex: 1 1 auto; min-width: 0; }

/* 侧栏把手（收起态竖排标识） */
#side-grip {
  position: absolute; inset: 0; z-index: 5;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  padding-top: 18px; gap: 10px;
  writing-mode: vertical-rl; letter-spacing: .35em;
  font-size: 12px; font-weight: 700; color: var(--text-faint);
  background: var(--sidebar-bg); border-right: 1px solid var(--card-border);
  transition: opacity .2s ease;
}
#layout.side-open #side-grip { opacity: 0; pointer-events: none; }
#side-grip .grip-icon { writing-mode: horizontal-tb; font-size: 15px; color: var(--accent); }

/* 侧栏面板 */
#side-panel {
  display: flex; flex-direction: column; height: 100%;
  width: 100%;
  opacity: 0; pointer-events: none;
  transition: opacity .25s ease;
}
#layout.side-open #side-panel { opacity: 1; pointer-events: auto; }
.side-head { padding: 14px 16px 10px; }
#side-search {
  width: 100%; height: 40px; border-radius: 12px;
  padding: 0 14px; font-size: 13.5px;
  background: var(--card); border: 1px solid var(--card-border);
  box-shadow: var(--shadow-s); outline: none; color: var(--text);
  transition: box-shadow .2s, border-color .2s;
}
#side-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,110,247,.15); }
#side-search::placeholder { color: var(--text-faint); }
.side-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 8px; }
.side-chips .chip {
  padding: 4px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
  color: var(--text-soft); background: var(--card); border: 1px solid var(--card-border);
  transition: all .15s ease;
}
.side-chips .chip:hover { transform: translateY(-1px); box-shadow: var(--shadow-s); }
.side-chips .chip.on { background: var(--accent); color: #fff; border-color: transparent; }
.side-label {
  padding: 6px 18px 8px; font-size: 11px; font-weight: 700; letter-spacing: .08em;
  color: var(--text-faint); text-transform: uppercase;
  display: flex; align-items: center; justify-content: space-between;
}
.side-label em { font-style: normal; font-weight: 600; }

#post-scroll { flex: 1; overflow-y: auto; padding: 2px 14px 20px; overscroll-behavior: contain; }
#post-scroll::-webkit-scrollbar { width: 6px; }
#post-scroll::-webkit-scrollbar-thumb { background: rgba(120,130,160,.3); border-radius: 8px; }

/* ========== 胶囊（核心视觉） ========== */
.pill-wrap { perspective: 700px; margin-bottom: 10px; }
.pill {
  width: 100%; text-align: left;
  display: flex; align-items: center; gap: 10px;
  min-height: 46px; padding: 6px 12px;
  border-radius: 999px;
  background: var(--pill-bg);
  border: 1px solid var(--pill-border);
  box-shadow: var(--shadow-s);
  transition: transform .3s cubic-bezier(.2,.9,.3,1.4), box-shadow .3s ease, background .3s ease;
  transform-origin: left center;
  animation: none;
}
.pill-wrap:hover .pill { animation: wiggle .5s ease; }
@keyframes wiggle {
  0%   { transform: rotate(0deg) translateX(0); }
  20%  { transform: rotate(-1.5deg) translateX(-2px); }
  40%  { transform: rotate(1.3deg)  translateX(2px); }
  60%  { transform: rotate(-1.0deg) translateX(-1px); }
  80%  { transform: rotate(.6deg)   translateX(1px); }
  100% { transform: rotate(0deg) translateX(0); }
}
.pill .p-date {
  flex: 0 0 auto; padding: 3px 9px; border-radius: 999px;
  font-size: 10.5px; font-weight: 700; color: #5560b8; letter-spacing: .02em;
  background: var(--accent-soft); white-space: nowrap;
}
.pill .p-title {
  flex: 1; min-width: 0;
  font-size: 13px; font-weight: 650; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pill .p-tag { flex: 0 0 auto; font-size: 10px; font-weight: 700; color: var(--text-faint); background: var(--card); border: 1px solid var(--card-border); border-radius: 999px; padding: 2px 8px; }
/* 选中：吸起变大（Apple Watch 式 3D） */
.pill.selected {
  background: var(--accent);
  border-color: transparent;
  transform: perspective(700px) translateX(4px) scale(1.09) rotateY(-4deg);
  box-shadow: 0 14px 30px rgba(79,110,247,.35);
  animation: none;
}
.pill.selected .p-date { background: rgba(255,255,255,.22); color: #fff; }
.pill.selected .p-title { color: #fff; }
.pill.selected .p-tag { background: rgba(255,255,255,.16); color: #fff; border-color: transparent; }
/* 长按吸起更强 */
.pill.pressing {
  transform: perspective(700px) translateY(-4px) scale(1.16) rotateY(-7deg);
  box-shadow: 0 20px 40px rgba(79,110,247,.4);
}
.empty-tip { text-align: center; color: var(--text-faint); font-size: 12.5px; padding: 26px 8px; }

/* ========== 内容区 ========== */
#content { position: relative; }
.view { display: none; padding: 26px 30px 40px; max-width: 900px; margin: 0 auto; }
.view.on { display: block; animation: fadeUp .35s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.view h1.hero { font-size: 26px; font-weight: 800; letter-spacing: -.01em; margin-bottom: 4px; }
.view .hero-sub { color: var(--text-soft); font-size: 13.5px; margin-bottom: 22px; }

/* 精选卡片 */
.pin-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 26px; }
.pin-card {
  position: relative; text-align: left;
  padding: 20px 20px 18px;
  border-radius: 18px;
  background: var(--card);
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow-s);
  transition: transform .22s cubic-bezier(.2,.9,.3,1.3), box-shadow .22s ease;
  overflow: hidden;
}
.pin-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-m); }
.pin-card .pc-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.pin-card .badge { font-size: 10.5px; font-weight: 800; letter-spacing: .04em; color: #fff; background: linear-gradient(135deg,#4f6ef7,#8b5cf6); padding: 3px 10px; border-radius: 999px; }
.pin-card .pc-date { font-size: 11px; color: var(--text-faint); font-weight: 600; font-variant-numeric: tabular-nums; }
.pin-card h3 { font-size: 17px; font-weight: 750; line-height: 1.4; margin-bottom: 8px; }
.pin-card p { font-size: 12.8px; line-height: 1.7; color: var(--text-soft); margin-bottom: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.pin-card .pc-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 10.5px; padding: 2px 9px; border-radius: 999px; font-weight: 700; background: var(--accent-soft); color: #5560b8; }
.pin-card .pc-more { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--accent); }

/* 翻页器 */
.pager { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 0 4px; }
.pg-btn {
  min-width: 34px; height: 34px; padding: 0 12px; border-radius: 10px;
  font-size: 13px; font-weight: 700; color: var(--text-soft);
  background: var(--card); border: 1px solid var(--card-border); box-shadow: var(--shadow-s);
  transition: all .15s ease;
}
.pg-btn:hover:not(:disabled) { color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow-m); }
.pg-btn:disabled { opacity: .35; cursor: not-allowed; }
.pg-info { font-size: 12.5px; font-weight: 650; color: var(--text-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pg-info b { color: var(--accent); font-weight: 800; }
.pg-input {
  width: 58px; height: 34px; border-radius: 10px; text-align: center;
  font-size: 13px; font-weight: 700; color: var(--text);
  background: var(--card); border: 1px solid var(--card-border); outline: none;
}
.pg-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,110,247,.15); }

/* 文章阅读 */
.reader-head { margin-bottom: 20px; }
.reader-head .r-cats { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.reader-head h1 { font-size: clamp(22px, 4.5vw, 30px); font-weight: 800; line-height: 1.3; letter-spacing: -.01em; }
.reader-head .r-meta { display: flex; gap: 12px; align-items: center; margin-top: 10px; color: var(--text-faint); font-size: 12.5px; font-weight: 600; }
.md-body { line-height: 1.9; font-size: 15px; }
.md-body h1, .md-body h2, .md-body h3, .md-body h4 { font-weight: 750; margin: 1.5em 0 .5em; line-height: 1.35; }
.md-body h1 { font-size: 1.45em; } .md-body h2 { font-size: 1.28em; } .md-body h3 { font-size: 1.12em; }
.md-body p { margin: .85em 0; }
.md-body a { text-decoration: underline; text-underline-offset: 3px; }
.md-body code { background: var(--accent-soft); color: #4a56a8; padding: .14em .42em; border-radius: 6px; font-family: var(--font-mono); font-size: .86em; }
.md-body pre { background: #131729; color: #d9e3ff; border-radius: 14px; padding: 16px 18px; overflow-x: auto; margin: 1.2em 0; font-size: 13px; line-height: 1.65; }
.md-body pre code { background: none; color: inherit; padding: 0; }
.md-body blockquote { border-left: 3px solid var(--accent); padding: 2px 0 2px 16px; margin: 1.2em 0; color: var(--text-soft); }
.md-body ul, .md-body ol { margin: .9em 0; padding-left: 1.5em; }
.md-body li { margin: .35em 0; }
.md-body hr { border: 0; height: 1px; background: var(--card-border); margin: 1.8em 0; }
.md-body img { border-radius: 14px; margin: 1em 0; }
.md-body table { border-collapse: collapse; margin: 1.2em 0; width: 100%; font-size: 13.5px; }
.md-body th, .md-body td { border: 1px solid var(--card-border); padding: 8px 12px; text-align: left; }
.md-body th { background: var(--accent-soft); font-weight: 700; }
.reader-foot { display: flex; gap: 10px; margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--card-border); }
.pn-btn { flex: 1; padding: 12px 14px; border-radius: 12px; font-size: 12.5px; font-weight: 700; color: var(--text-soft); background: var(--card); border: 1px solid var(--card-border); box-shadow: var(--shadow-s); text-align: center; transition: all .15s; }
.pn-btn:hover:not(.disabled) { color: var(--accent); transform: translateY(-1px); }
.pn-btn.disabled { opacity: .35; pointer-events: none; }

/* 归档 */
.arch-year { margin: 26px 0 10px; display: flex; align-items: center; gap: 10px; }
.arch-year h2 { font-size: 18px; font-weight: 800; }
.arch-year .count { font-size: 11.5px; font-weight: 700; color: var(--text-faint); background: var(--card); border: 1px solid var(--card-border); padding: 2px 10px; border-radius: 999px; }
.arch-list { display: flex; flex-direction: column; }
.arch-item { display: flex; align-items: center; gap: 14px; padding: 10px 4px; border-bottom: 1px dashed var(--card-border); text-align: left; width: 100%; }
.arch-item .a-date { font-size: 12px; font-weight: 700; color: var(--text-faint); font-variant-numeric: tabular-nums; width: 84px; flex-shrink: 0; }
.arch-item .a-title { font-size: 14.5px; font-weight: 650; color: var(--text); flex: 1; }
.arch-item:hover .a-title { color: var(--accent); }

/* 关于 */
.about-card { padding: 26px; border-radius: 20px; background: var(--card); border: 1px solid var(--card-border); box-shadow: var(--shadow-s); }
.about-card .a-hero { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
.about-card .avatar { width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #fff; background: linear-gradient(135deg,#4f6ef7,#8b5cf6); box-shadow: var(--shadow-m); }
.about-card .a-hero h2 { font-size: 19px; font-weight: 800; }
.about-card .a-hero p { font-size: 12.5px; color: var(--text-soft); margin-top: 3px; }
.about-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin: 18px 0; }
.stat { padding: 14px 8px; border-radius: 14px; text-align: center; background: var(--bg); border: 1px solid var(--card-border); }
.stat b { display: block; font-size: 20px; font-weight: 800; color: var(--accent); }
.stat span { font-size: 11px; color: var(--text-faint); }
.about-card .a-links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.link-btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border-radius: 11px; font-size: 12.5px; font-weight: 600; color: var(--text); background: var(--bg); border: 1px solid var(--card-border); transition: all .15s; }
.link-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-m); }

/* ========== 移动端（侧栏变抽屉） ========== */
#scrim { position: fixed; inset: 0; z-index: 78; background: rgba(10,14,30,.45); opacity: 0; pointer-events: none; transition: opacity .3s; }
body.m-side-open #scrim { opacity: 1; pointer-events: auto; }
@media (max-width: 720px) {
  #layout { display: block; }
  #sidebar {
    position: fixed; top: 54px; bottom: 0; left: 0; z-index: 80;
    flex: none !important; width: min(84vw, 340px); max-width: none;
    transform: translateX(-102%);
    transition: transform .32s cubic-bezier(.25,.8,.25,1);
    box-shadow: var(--shadow-l);
  }
  body.m-side-open #sidebar { transform: translateX(0); }
  #side-grip { display: none; }
  #side-panel { opacity: 1 !important; pointer-events: auto !important; }
  .side-head { padding: 12px 12px 8px; }
  .side-chips { padding: 0 12px 6px; }
  #post-scroll { padding: 2px 12px 18px; }
  .pin-grid { grid-template-columns: 1fr; }
  .view { padding: 18px 16px 30px; }
  .tb-brand span { display: none; }
  .arch-item .a-date { width: 70px; }
  .about-stats { grid-template-columns: repeat(2,1fr); }
}
</style>
</head>
<body>

<header id="topbar">
  <button id="tb-side-btn" aria-label="目录">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    <span id="tb-side-label">目录</span>
  </button>
  <div class="tb-brand">
    <b>Jerry 的赛博博客</b>
    <span>记录赛博修仙日常</span>
  </div>
  <nav class="tb-nav">
    <button data-nav="home" class="on">主页</button>
    <button data-nav="archive">归档</button>
    <button data-nav="about">关于</button>
  </nav>
  <button id="tb-theme" title="切换主题">🌙</button>
</header>

<div id="layout">
  <aside id="sidebar">
    <div id="side-grip"><span class="grip-icon">☰</span>目&nbsp;录</div>
    <div id="side-panel">
      <div class="side-head">
        <input id="side-search" type="text" placeholder="🔍 搜索标题 / 标签 / 日期…" autocomplete="off">
      </div>
      <div class="side-chips" id="side-chips"></div>
      <div class="side-label"><span>最新文章</span><em id="side-count"></em></div>
      <div id="post-scroll"></div>
    </div>
  </aside>

  <div id="content">
    <!-- 主页：精选 -->
    <section class="view" id="view-home">
      <h1 class="hero">精选内容 🌟</h1>
      <p class="hero-sub">置顶的好东西 —— 技术分享、随笔、作文，固定在第一页。</p>
      <div class="pin-grid" id="pin-grid"></div>
      <div class="pager" id="pager-home"></div>
    </section>

    <!-- 文章阅读 -->
    <section class="view" id="view-reader">
      <div class="reader-head">
        <div class="r-cats" id="r-cats"></div>
        <h1 id="r-title"></h1>
        <div class="r-meta" id="r-meta"></div>
      </div>
      <div class="md-body" id="r-body"></div>
      <div class="reader-foot" id="r-foot"></div>
    </section>

    <!-- 归档 -->
    <section class="view" id="view-archive">
      <h1 class="hero">归档 🗂️</h1>
      <p class="hero-sub">全部文章，按时间倒序。</p>
      <div id="arch-body"></div>
    </section>

    <!-- 关于 -->
    <section class="view" id="view-about">
      <h1 class="hero">关于 ℹ️</h1>
      <p class="hero-sub">赛博修仙，从记录开始。</p>
      <div class="about-card" id="about-body"></div>
    </section>
  </div>
</div>

<div id="scrim"></div>
