<style>
/* ========== iOS 系统色板 ========== */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --accent: #007aff;
  --accent-soft: rgba(0,122,255,.12);

  --bg: #f2f2f7;
  --card: rgba(255,255,255,.8);
  --card-border: rgba(60,60,67,.12);
  --text: #111114;
  --text-soft: rgba(60,60,67,.62);
  --text-faint: rgba(60,60,67,.38);

  --bar-bg: rgba(249,249,251,.72);
  --pill-bg: rgba(255,255,255,.72);
  --pill-hover: rgba(0,122,255,.08);

  --shadow-s: 0 1px 2px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.05);
  --shadow-m: 0 2px 6px rgba(0,0,0,.05), 0 10px 30px rgba(0,0,0,.09);
  --shadow-l: 0 18px 50px rgba(0,0,0,.18);

  /* ================= 设计尺度（8px 栅格） =================
     原来各处的圆角和间距都是散着写的（10/12/14/16/18/22/24 混用），
     这里统一成一套尺度，新写样式直接用变量，不要再写魔法数字。 */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 48px;

  --radius-s: 8px;
  --radius-m: 12px;
  --radius-l: 16px;
  --radius-xl: 22px;
  --radius-pill: 999px;

  /* 阅读区域宽度：中文正文一行 30-40 字最舒服，920px 太宽了 */
  --reading-width: 46rem;

  --ease: cubic-bezier(.32,.72,0,1);
  --dur-fast: .16s;
  --dur: .24s;
  --dur-slow: .38s;

  /* 代码高亮配色（浅色） */
  --code-bg: rgba(120,120,128,.08);
  --code-comment: #8a8f98;
  --code-keyword: #a626a4;
  --code-string: #50a14f;
  --code-number: #b76b01;
  --code-func: #4078f2;
}
body.dark {
  --accent: #0a84ff;
  --accent-soft: rgba(10,132,255,.16);

  --bg: #000000;
  --card: rgba(28,28,30,.78);
  --card-border: rgba(255,255,255,.10);
  --text: #f5f5f7;
  --text-soft: rgba(235,235,245,.60);
  --text-faint: rgba(235,235,245,.36);

  --bar-bg: rgba(28,28,30,.72);
  --pill-bg: rgba(44,44,46,.78);
  --pill-hover: rgba(10,132,255,.16);

  --shadow-s: 0 1px 2px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.4);
  --shadow-m: 0 2px 6px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.5);
  --shadow-l: 0 18px 50px rgba(0,0,0,.7);

  /* 代码高亮配色（深色，参考 One Dark） */
  --code-bg: rgba(255,255,255,.06);
  --code-comment: #7f848e;
  --code-keyword: #c678dd;
  --code-string: #98c379;
  --code-number: #d19a66;
  --code-func: #61afef;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
  transition: background .35s ease, color .35s ease;
}
button { font-family: inherit; border: 0; background: none; color: inherit; cursor: pointer; }
a { color: var(--accent); text-decoration: none; }
::selection { background: rgba(0,122,255,.22); }
input { font-family: inherit; }

/* ========== 顶栏（毛玻璃） ========== */
.icon-btn {
  width: 44px; height: 44px; border-radius: 999px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-soft);
  transition: background .18s ease, color .18s ease, transform .12s ease;
}
.icon-btn:hover { background: var(--accent-soft); color: var(--accent); }
.icon-btn:active { transform: scale(.88); }
.icon-btn svg { width: 17px; height: 17px; }
.top-area {
  position: fixed; top: 0; left: 0; right: 0; z-index: 60;
  background: var(--bar-bg);
  backdrop-filter: blur(24px) saturate(1.8);
  -webkit-backdrop-filter: blur(24px) saturate(1.8);
  border-bottom: 1px solid var(--card-border);
  transition: width .3s cubic-bezier(.25,.8,.25,1), margin .3s cubic-bezier(.25,.8,.25,1),
              border-radius .3s ease, box-shadow .3s ease;
  will-change: width, margin, border-radius, box-shadow;
}
.top-area.compact {
  width: min(88vw, 300px);
  margin: 6px auto 0;
  border-radius: 999px;
  border-bottom-color: transparent;
  box-shadow: var(--shadow-m);
}
.top-area.compact #topbar { height: 30px; }
#topbar {
  display: flex; align-items: center; gap: 10px;
  height: 36px; padding: 0 10px;
  padding-top: env(safe-area-inset-top);
  transition: height .3s cubic-bezier(.25,.8,.25,1);
}
#tb-side-btn { display: none; }
#tb-brand { display: flex; align-items: center; gap: 9px; min-width: 0; white-space: nowrap; overflow: hidden; margin-right: auto; }
.brand-avatar { width: 24px; height: 24px; border-radius: 999px; object-fit: cover; flex: 0 0 auto; }
.brand-text { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
#tb-brand b { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
#tb-brand span { font-size: 11px; color: var(--text-faint); flex-shrink: 1; overflow: hidden; text-overflow: ellipsis; }
#tb-tabs { display: flex; gap: 22px; margin-left: auto; overflow: hidden; transition: max-height .26s ease, opacity .2s ease, gap .26s ease; max-height: 30px; opacity: 1; }
#tb-tabs button {
  position: relative; padding: 4px 2px;
  font-size: 13px; font-weight: 500; letter-spacing: .02em;
  color: var(--text-faint);
  transition: color .18s ease;
}
#tb-tabs button::after {
  content: ""; position: absolute; left: 50%; bottom: -1px; transform: translateX(-50%);
  width: 0; height: 2px; border-radius: 2px; background: var(--accent);
  transition: width .22s cubic-bezier(.2,.9,.3,1.3);
}
#tb-tabs button.on { color: var(--text); }
#tb-tabs button.on::after { width: 16px; }
.top-area.compact #tb-tabs { max-height: 0; opacity: 0; gap: 0; }
#tb-theme { justify-self: end; }
#layout { padding-top: calc(84px + env(safe-area-inset-top)); }
#tb-theme svg { width: 16px; height: 16px; }
.tabbar {
  display: flex; align-items: center; justify-content: center; gap: 34px;
  padding: 2px 0 12px;
}
.tabbar button {
  position: relative; padding: 5px 2px;
  font-size: 14px; font-weight: 500; letter-spacing: .02em;
  color: var(--text-faint);
  transition: color .18s ease;
}
.tabbar button::after {
  content: ""; position: absolute; left: 50%; bottom: -2px; transform: translateX(-50%);
  width: 0; height: 3px; border-radius: 3px; background: var(--accent);
  transition: width .22s cubic-bezier(.2,.9,.3,1.3);
}
.tabbar button.on { color: var(--text); }
.tabbar button.on::after { width: 22px; }
#tb-theme .i-sun { display: none; }
body.dark #tb-theme .i-moon { display: none; }
body.dark #tb-theme .i-sun { display: block; }

/* ========== 布局 ========== */
#layout { display: flex; min-height: calc(100vh - 52px); }
#sidebar {
  position: sticky; top: 52px;
  align-self: flex-start;
  flex: 0 0 34px;
  min-width: 0; max-width: 520px;
  margin: 0 16px 16px 12px;
  border-radius: 17px;
  height: calc(100vh - 68px);
  min-height: 0;
  transition: flex-basis .45s cubic-bezier(.25,.8,.25,1), border-radius .45s ease;
  background: var(--bar-bg);
  backdrop-filter: blur(24px) saturate(1.8);
  -webkit-backdrop-filter: blur(24px) saturate(1.8);
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow-m);
  overflow: hidden;
  display: flex; flex-direction: column;
}
#layout.side-open #sidebar { flex-basis: 40%; }
#content { flex: 1 1 auto; min-width: 0; }

/* 收起态把手 */
#side-grip {
  position: absolute; inset: 0; z-index: 5;
  background: inherit;
  cursor: pointer;
  transition: background-color .22s ease;
}
#layout.side-open #side-grip { opacity: 0; pointer-events: none; }
#side-grip:hover { background-color: var(--accent-soft); }

/* 侧栏面板 */
#side-panel { display: flex; flex-direction: column; height: 100%; width: 100%; opacity: 0; pointer-events: none; transition: opacity .25s ease; }
#layout.side-open #side-panel { opacity: 1; pointer-events: auto; }
.side-head { padding: 14px 16px 8px; }
.side-head-top { display: flex; align-items: center; justify-content: space-between; padding: 0 2px 10px; }
.side-head-top .t { font-size: 13px; font-weight: 600; color: var(--text-soft); }
.side-collapse {
  width: 28px; height: 28px; border-radius: 999px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-faint);
  transition: background .18s ease, color .18s ease, transform .12s ease;
}
.side-collapse:hover { background: var(--accent-soft); color: var(--accent); }
.side-collapse:active { transform: scale(.88); }
.side-collapse svg { width: 13px; height: 13px; }
.side-search-box { position: relative; }
.side-search-box .s-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-faint); pointer-events: none; }
#side-search {
  width: 100%; height: 38px; border-radius: 10px;
  padding: 0 12px 0 34px; font-size: 13.5px;
  background: var(--card); border: 1px solid var(--card-border);
  box-shadow: var(--shadow-s); outline: none; color: var(--text);
  transition: box-shadow .2s, border-color .2s;
  appearance: none; -webkit-appearance: none;
}
#side-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
#side-search::placeholder { color: var(--text-faint); }
input[type="search"]::-webkit-search-cancel-button { display: none; }
.side-modes { display: flex; gap: 6px; padding: 0 14px 10px; }
.side-modes .mode {
  flex: 1; padding: 10px 0; border-radius: 999px;
  font-size: 11.5px; font-weight: 500; text-align: center;
  color: var(--text-soft); background: var(--card);
  border: 1px solid var(--card-border);
  transition: background .18s ease, color .18s ease, transform .12s ease, border-color .18s ease;
}
.side-modes .mode:hover { color: var(--accent); border-color: var(--accent); }
.side-modes .mode.on { background: var(--accent); color: #fff; border-color: transparent; }
.group-head {
  padding: 10px 6px 6px; font-size: 11px; font-weight: 600; letter-spacing: .05em;
  color: var(--text-faint); text-transform: uppercase;
  display: flex; align-items: center; gap: 8px;
}
.group-head::after { content: ""; flex: 1; height: 1px; background: var(--card-border); }

/* 大纲（文章摘要导航） */
.outline-item {
  display: block; width: 100%; text-align: left;
  padding: 6px 4px 6px 10px; border-radius: 9px;
  font-size: 12.5px; font-weight: 500; color: var(--text-soft);
  line-height: 1.45;
  transition: background .15s ease, color .15s ease, padding-left .18s ease;
}
.outline-item:hover { background: var(--accent-soft); color: var(--accent); padding-left: 14px; }
.outline-item.lv1 { font-weight: 600; color: var(--text); }
.outline-item.lv2 { padding-left: 22px; }
.outline-item.lv3 { padding-left: 34px; font-size: 12px; color: var(--text-faint); }
.outline-empty { color: var(--text-faint); font-size: 12px; padding: 12px 6px; }

/* 阅读进度条 */
#progress-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 75;
  height: 2px; width: 0;
  background: var(--accent);
  opacity: 0; transition: opacity .3s ease, width .1s linear;
  pointer-events: none;
}
#progress-bar.show { opacity: 1; }

/* 阅读字号控件（iOS 阅读器样式） */
.r-fontbar {
  display: none; align-items: center; gap: 2px;
  padding: 3px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--card-border);
  box-shadow: var(--shadow-s);
}
#view-reader .r-fontbar { display: flex; justify-content: flex-end; margin-top: 10px; }
.r-fontbar button {
  width: 26px; height: 26px; border-radius: 999px;
  font-size: 12px; font-weight: 600; color: var(--text-soft);
  display: flex; align-items: center; justify-content: center;
  transition: background .15s ease, color .15s ease;
}
.r-fontbar button:hover { background: var(--accent-soft); color: var(--accent); }
.r-fontbar button:active { transform: scale(.9); }
.r-fontbar span { font-size: 11px; font-weight: 600; color: var(--text-faint); padding: 0 3px; font-variant-numeric: tabular-nums; }

/* 站点页脚 */
.site-footer {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  max-width: 900px; margin: 6px auto 0; padding: 18px 8px calc(26px + env(safe-area-inset-bottom));
  font-size: 11.5px; color: var(--text-faint);
}
.site-footer .sf-links { display: flex; gap: 12px; }
.site-footer a { color: var(--text-soft); font-weight: 500; }
.site-footer a:hover { color: var(--accent); }

/* 相关文章 */
.r-related { margin-top: 26px; }
.rel-title { font-size: 12px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
.rel-list { display: flex; flex-direction: column; gap: 8px; }
.rel-item {
  display: flex; align-items: baseline; gap: 12px; width: 100%;
  padding: 11px 14px; border-radius: 12px; text-align: left;
  background: var(--card); border: 1px solid var(--card-border);
  transition: transform .16s ease, background .16s ease;
}
.rel-item:hover { transform: translateY(-1px); background: var(--accent-soft); }
.rel-item .rel-date { flex: 0 0 auto; font-size: 10.5px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
.rel-item .rel-t { flex: 1; min-width: 0; font-size: 13px; font-weight: 550; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 键盘焦点环（a11y） */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
button:focus:not(:focus-visible) { outline: none; }

/* 动效降级（系统设置减少动态） */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  .pill::after, .pin-card::after, .home-item::after { display: none; }
  .pill, .pin-card, .home-item { transform: none !important; }
  .home-item, .about-card, .pill, .pin-card { backdrop-filter: none; -webkit-backdrop-filter: none; }
}

/* 代码复制按钮 */
.md-body pre { position: relative; }
.code-copy {
  position: absolute; top: 8px; right: 8px;
  padding: 4px 10px; border-radius: 8px;
  font-size: 10.5px; font-weight: 600; color: var(--text-soft);
  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18);
  opacity: 0; transition: opacity .2s ease, background .15s ease;
}
.md-body pre:hover .code-copy { opacity: 1; }
.code-copy:hover { background: rgba(255,255,255,.24); }

/* 数据加载中 */
.loading-tip { text-align: center; color: var(--text-faint); font-size: 12px; padding: 28px 8px; }

/* 回到顶部 + Toast */
#back-top {
  position: fixed; right: 18px; bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 70;
  width: 44px; height: 44px; border-radius: 999px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-soft);
  background: var(--bar-bg);
  backdrop-filter: blur(18px) saturate(1.6);
  -webkit-backdrop-filter: blur(18px) saturate(1.6);
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow-m);
  opacity: 0; pointer-events: none; transform: translateY(8px);
  transition: opacity .25s ease, transform .25s ease, color .18s ease, background .18s ease;
}
#back-top.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
#back-top:hover { color: var(--accent); background: var(--card); }
#back-top:active { transform: scale(.9); }
#back-top svg { width: 17px; height: 17px; }
#toast {
  position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(12px);
  z-index: 90; padding: 10px 18px; border-radius: 999px;
  font-size: 12.5px; font-weight: 500; color: var(--text);
  background: var(--bar-bg);
  backdrop-filter: blur(20px) saturate(1.6);
  -webkit-backdrop-filter: blur(20px) saturate(1.6);
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow-m);
  opacity: 0; pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 3D tilt + 反光（PC 精细指针） */
.pill, .pin-card { will-change: transform; transition: transform .2s ease-out, box-shadow .2s ease, background .2s ease; }
.pill { position: relative; }
.pin-card { position: relative; }
.pill::after, .pin-card::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  background: radial-gradient(220px circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,.34), transparent 55%);
  opacity: 0; transition: opacity .25s ease; pointer-events: none;
}
body.dark .pill::after, body.dark .pin-card::after { background: radial-gradient(220px circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,.12), transparent 55%); }
@media (hover: hover) and (pointer: fine) {
  .pill:hover::after, .pin-card:hover::after { opacity: 1; }
}
.md-body h1, .md-body h2, .md-body h3, .md-body h4 { scroll-margin-top: 64px; }
.flash { animation: flashSec 1.6s ease; }
@keyframes flashSec { 0%, 55% { background: var(--accent-soft); border-radius: 6px; padding: 2px 6px; margin: 0 -6px; } 100% { background: transparent; } }
.side-label {
  padding: 4px 20px 8px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
  color: var(--text-faint);
  display: flex; align-items: center; justify-content: space-between;
}
.side-label em { font-style: normal; font-weight: 500; }
#post-scroll { flex: 1; overflow-y: auto; padding: 2px 14px 20px; overscroll-behavior: contain; }
#post-scroll::-webkit-scrollbar { width: 6px; }
#post-scroll::-webkit-scrollbar-thumb { background: rgba(120,125,135,.28); border-radius: 8px; }

/* ========== 胶囊 ========== */
.pill-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.pill-wrap { perspective: 700px; }
.pill {
  width: 100%; text-align: left;
  aspect-ratio: 4 / 3;
  display: flex; flex-direction: column; align-items: stretch; justify-content: space-between;
  padding: 12px 13px 10px;
  border-radius: 18px;
  background: var(--pill-bg);
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow-s);
  transition: transform .3s cubic-bezier(.2,.9,.3,1.3), box-shadow .3s ease, background .3s ease;
  transform-origin: left center;
  overflow: hidden;
}
.pill-wrap:hover .pill { transform: perspective(700px) rotateX(0deg) rotateY(0deg) translateY(-2px); }
.pill .p-date {
  align-self: flex-start; padding: 2px 8px; border-radius: 999px;
  font-size: 9.5px; font-weight: 600; color: var(--accent);
  background: var(--accent-soft); white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.pill .p-title {
  font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.45;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  margin: 4px 0 6px;
  letter-spacing: -.005em;
}
.pill .p-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: auto; }
.pill .p-words { font-size: 10px; font-weight: 500; color: var(--text-faint); font-variant-numeric: tabular-nums; margin-left: auto; }
.pill .p-tag {
  font-size: 9.5px; font-weight: 500; color: var(--text-soft);
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: 999px; padding: 1px 8px; white-space: nowrap; max-width: 92px; overflow: hidden; text-overflow: ellipsis;
}
.pill.selected {
  background: var(--accent);
  border-color: transparent;
  transform: perspective(700px) translateX(3px) scale(1.05) rotateY(-3deg);
  box-shadow: 0 10px 24px rgba(0,122,255,.28);
  animation: none;
}
.pill.selected .p-date { background: rgba(255,255,255,.2); color: #fff; }
.pill.selected .p-title { color: #fff; }
.pill.selected .p-tag { background: rgba(255,255,255,.16); color: #fff; border-color: transparent; }
.pill.selected .p-words { color: rgba(255,255,255,.75); }
.pill.pressing {
  transform: perspective(700px) translateY(-3px) scale(1.1) rotateY(-6deg);
  box-shadow: 0 14px 32px rgba(0,122,255,.32);
}
.empty-tip { text-align: center; color: var(--text-faint); font-size: 12.5px; padding: 28px 8px; }

/* ========== 内容区 ========== */
.view { display: none; padding: 30px 32px 44px; max-width: 860px; margin: 0 auto; }
.view.on { display: block; animation: fadeUp .35s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.view h1.hero { font-size: 24px; font-weight: 700; letter-spacing: -.015em; margin-bottom: 4px; }
.view .hero-sub { color: var(--text-soft); font-size: 13px; font-weight: 400; margin-bottom: 24px; }

/* 主页文章大卡（参考示例：左封面 + 右内容） */
.home-list { display: flex; flex-direction: column; gap: 16px; width: 75%; max-width: 1000px; margin: 0 auto; padding-bottom: 22px; }
.home-item {
  display: grid; grid-template-columns: 280px 1fr; gap: 0;
  width: 100%; min-height: 176px; overflow: hidden;
  border-radius: 18px; text-align: left;
  background: var(--card); border: 1px solid var(--card-border); box-shadow: var(--shadow-s);
  transition: transform .2s ease-out, box-shadow .2s ease, background .2s ease;
  position: relative;
}
.home-item:active { transform: scale(.985); }
.home-item:hover { box-shadow: var(--shadow-m); }
.home-item.no-cover { grid-template-columns: 1fr; }
.home-item .hi-cover { width: 100%; height: 100%; min-height: 176px; object-fit: cover; display: block; }
.home-item .hi-body { display: flex; flex-direction: column; justify-content: center; gap: 9px; padding: 18px 24px; min-width: 0; }
.home-item .hi-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.home-item .hi-date {
  padding: 4px 11px; border-radius: 999px;
  font-size: 10.5px; font-weight: 600; color: var(--accent);
  background: var(--accent-soft); white-space: nowrap; font-variant-numeric: tabular-nums;
}
.home-item .hi-cats { font-size: 10.5px; font-weight: 500; color: var(--text-faint); background: var(--card); border: 1px solid var(--card-border); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.home-item .hi-title { font-size: 20px; font-weight: 700; letter-spacing: -.015em; line-height: 1.35; }
.home-item .hi-excerpt { font-size: 13px; color: var(--text-soft); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.home-item .hi-meta { display: flex; align-items: center; gap: 10px; margin-top: 2px; }
.home-item .hi-meta .p-words { font-size: 11px; color: var(--text-faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.home-item .hi-meta .p-tag { font-size: 10px; font-weight: 500; color: var(--text-soft); background: var(--card); border: 1px solid var(--card-border); border-radius: 999px; padding: 2px 9px; white-space: nowrap; max-width: 90px; overflow: hidden; text-overflow: ellipsis; }
.home-item .hi-arrow { margin-left: auto; font-size: 12.5px; font-weight: 550; color: var(--accent); transition: transform .2s ease; }
.home-item:hover .hi-arrow { transform: translateX(3px); }
.home-item::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  background: radial-gradient(300px circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,.3), transparent 55%);
  opacity: 0; transition: opacity .25s ease; pointer-events: none;
}
body.dark .home-item::after { background: radial-gradient(300px circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,.1), transparent 55%); }
@media (hover: hover) and (pointer: fine) {
  .home-item:hover::after { opacity: 1; }
}
.pin-card {
  position: relative; text-align: left;
  padding: 20px 20px 16px;
  border-radius: 16px;
  background: var(--card);
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow-s);
  transition: transform .25s cubic-bezier(.2,.9,.3,1.3), box-shadow .25s ease;
  overflow: hidden;
}
.pin-card:hover { transform: translateY(-2px) scale(1.01); box-shadow: var(--shadow-m); }
.pin-card .pc-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.pin-card .pc-date { font-size: 11px; color: var(--text-faint); font-weight: 500; font-variant-numeric: tabular-nums; }
.pin-card h3 { font-size: 16px; font-weight: 650; line-height: 1.4; margin-bottom: 8px; letter-spacing: -.01em; }
.pin-card p { font-size: 12.5px; line-height: 1.7; color: var(--text-soft); margin-bottom: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.pin-card .pc-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.cat-tag, .tag {
  display: inline-block; font-size: 10.5px; padding: 2px 9px; border-radius: 999px;
  font-weight: 500; background: var(--accent-soft); color: var(--accent);
}
.cat-tag { background: var(--card); color: var(--text-soft); border: 1px solid var(--card-border); }
.pin-card .pc-more { margin-left: auto; font-size: 12px; font-weight: 550; color: var(--text-faint); transition: color .15s; }
.pin-card:hover .pc-more { color: var(--accent); }

/* 翻页器 */
.pager { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 6px 0 2px; }
.pg-btn {
  min-width: 36px; height: 34px; padding: 0 13px; border-radius: 999px;
  font-size: 13px; font-weight: 500; color: var(--text-soft);
  background: transparent; border: 0;
  transition: background .15s ease, color .15s ease, opacity .15s ease;
}
.pg-btn:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent); }
.pg-btn:disabled { opacity: .3; cursor: not-allowed; }
.pg-info { font-size: 12.5px; font-weight: 500; color: var(--text-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pg-info b { color: var(--text); font-weight: 650; }
.pg-input {
  width: 46px; height: 34px; border-radius: 12px; text-align: center;
  font-size: 14px; font-weight: 500; color: var(--text);
  background: var(--card); border: 1px solid var(--card-border); outline: none;
  font-variant-numeric: tabular-nums;
}
.pg-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

/* 阅读 */
.reader-head { margin-bottom: 22px; }
.reader-head .r-cats { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; line-height: 1.4; }
.reader-head h1 { font-size: clamp(21px, 4.4vw, 29px); font-weight: 700; line-height: 1.32; letter-spacing: -.015em; }
.reader-head .r-meta { display: flex; gap: 12px; align-items: center; margin-top: 14px; color: var(--text-faint); font-size: 12.5px; font-weight: 500; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.md-body { line-height: 2.05; font-size: 16.5px; }
.md-body > h1:first-child { display: none; }
/* 小节标题只作大纲锚点（正文隐藏，点击大纲仍可跳转） */
#view-reader .md-body h2 { height: 0; margin: 0; padding: 0; overflow: hidden; opacity: 0; font-size: 1px; line-height: 0; pointer-events: none; }
.md-body h1, .md-body h2, .md-body h3, .md-body h4 { font-weight: 700; margin: 2em 0 .6em; line-height: 1.35; letter-spacing: -.01em; }
.md-body h2 { font-size: 1.5em; border-bottom: 1px solid var(--card-border); padding-bottom: .3em; }
.md-body h1 { font-size: 1.42em; } .md-body h2 { font-size: 1.26em; } .md-body h3 { font-size: 1.1em; }
.md-body p { margin: .85em 0; }
.md-body a { text-decoration: underline; text-underline-offset: 3px; }
.md-body code { background: var(--accent-soft); color: var(--accent); padding: .14em .42em; border-radius: 6px; font-family: var(--font-mono); font-size: .86em; }
.md-body pre { background: #111111; color: #f2f2f7; border-radius: 12px; padding: 16px 18px; overflow-x: auto; margin: 1.2em 0; font-size: 13px; line-height: 1.65; }
.md-body pre code { background: none; color: inherit; padding: 0; }
.md-body blockquote { border-left: 3px solid var(--accent); padding: 2px 0 2px 16px; margin: 1.2em 0; color: var(--text-soft); }
.md-body ul, .md-body ol { margin: .9em 0; padding-left: 1.5em; }
.md-body li { margin: .35em 0; }
.md-body hr { border: 0; height: 1px; background: var(--card-border); margin: 1.8em 0; }
.md-body img { border-radius: 12px; margin: 1em 0; }
.md-body table { border-collapse: collapse; margin: 1.2em 0; width: 100%; font-size: 13.5px; }
.md-body th, .md-body td { border: 1px solid var(--card-border); padding: 8px 12px; text-align: left; }
.md-body th { background: var(--accent-soft); font-weight: 600; }
.reader-foot { display: flex; gap: 8px; margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--card-border); }
.pn-btn { flex: 1; padding: 11px 14px; border-radius: 11px; font-size: 12.5px; font-weight: 500; color: var(--text-soft); background: var(--card); border: 1px solid var(--card-border); box-shadow: var(--shadow-s); text-align: center; transition: all .15s; }
.pn-btn:hover:not(.disabled) { color: var(--accent); border-color: var(--accent); }
.pn-btn.disabled { opacity: .3; pointer-events: none; }

/* 归档 */
.arch-year { margin: 26px 0 8px; display: flex; align-items: center; gap: 10px; }
.arch-year h2 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.arch-year .count { font-size: 11px; font-weight: 500; color: var(--text-faint); background: var(--card); border: 1px solid var(--card-border); padding: 2px 10px; border-radius: 999px; }
.arch-list { display: flex; flex-direction: column; }
.arch-item { display: flex; align-items: center; gap: 14px; padding: 12px 4px; border-bottom: 1px solid var(--card-border); text-align: left; width: 100%; transition: padding-left .15s; }
.arch-item:hover { padding-left: 10px; }
.arch-item .a-date { font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 4px 11px; font-variant-numeric: tabular-nums; flex-shrink: 0; white-space: nowrap; }
.arch-item .a-title { font-size: 14px; font-weight: 550; color: var(--text); flex: 1; }

/* 壁纸层 */
#wallpaper {
  position: fixed; inset: 0; z-index: 0;
  background-size: cover; background-position: center;
  transition: background-image .5s ease;
}
#wall-shade {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.18) 60%, rgba(255,255,255,.3));
}
body.dark #wall-shade { background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.55) 60%, rgba(0,0,0,.7)); }
body.reading #wall-shade { background: linear-gradient(180deg, rgba(10,12,18,.62), rgba(10,12,18,.72) 60%, rgba(10,12,18,.78)); }
body.reading:not(.dark) #wall-shade { background: linear-gradient(180deg, rgba(244,246,250,.9), rgba(244,246,250,.94)); }
#desktop, #layout, #content { position: relative; z-index: 2; }

/* 卡片毛玻璃透视壁纸 */
.home-item, .about-card, .pill, .pin-card { backdrop-filter: blur(16px) saturate(1.25); -webkit-backdrop-filter: blur(16px) saturate(1.25); }

/* 关于（横向双栏） */
#view-about { max-width: 1120px; }
.about-layout { display: grid; grid-template-columns: 280px 1fr; gap: 16px; align-items: start; }
.about-side {
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px;
  padding: 26px 20px; border-radius: 18px;
  background: var(--card); border: 1px solid var(--card-border); box-shadow: var(--shadow-s);
  position: sticky; top: 60px;
}
.about-side .sect { width: 100%; text-align: left; }
.sect-t { font-size: 11px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
.cap-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
.side-cap { font-size: 11px; font-weight: 500; color: var(--text-soft); background: var(--bg); border: 1px solid var(--card-border); border-radius: 999px; padding: 3px 11px; }
.a-sub { font-size: 12px; color: var(--text-soft); }
.about-side .a-links { width: 100%; justify-content: center; }
.about-main { display: flex; flex-direction: column; gap: 14px; padding: 24px; border-radius: 18px; background: var(--card); border: 1px solid var(--card-border); box-shadow: var(--shadow-s); min-width: 0; }
.a-desc { font-size: 13px; line-height: 1.9; color: var(--text-soft); }
.a-foot { font-size: 11.5px; color: var(--text-faint); margin-top: 4px; }
.about-card { padding: 22px; border-radius: 18px; background: var(--card); border: 1px solid var(--card-border); box-shadow: var(--shadow-s); }
.wall-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 10px; }
.wall-thumb {
  aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; position: relative;
  background-size: cover; background-position: center;
  border: 2px solid transparent;
  transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
}
.wall-thumb:hover { transform: translateY(-2px); box-shadow: var(--shadow-m); }
.wall-thumb.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.wall-thumb .wt-name {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 8px 6px;
  font-size: 10px; font-weight: 600; color: var(--text);
  background: linear-gradient(180deg, transparent, rgba(0,0,0,.28));
}
.wall-thumb.clean { background: linear-gradient(135deg, #f2f2f7, #dde1ea); }
body.dark .wall-thumb.clean { background: linear-gradient(135deg, #1c1c1e, #333); }
.about-card .a-hero { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
.about-card .avatar { width: 64px; height: 64px; border-radius: 999px; overflow: hidden; flex: 0 0 auto; box-shadow: var(--shadow-m); border: 1px solid var(--card-border); }
.about-card .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.about-card .a-hero h2 { font-size: 18px; font-weight: 700; }
.about-card .a-hero p { font-size: 12.5px; color: var(--text-soft); margin-top: 3px; }
.about-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin: 18px 0; }
.stat { padding: 14px 8px; border-radius: 12px; text-align: center; background: var(--bg); border: 1px solid var(--card-border); }
.stat b { display: block; font-size: 19px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--text-faint); }
.about-card .a-links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.link-btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border-radius: 10px; font-size: 12.5px; font-weight: 500; color: var(--text); background: var(--bg); border: 1px solid var(--card-border); transition: all .15s; }
.link-btn:hover { color: var(--accent); border-color: var(--accent); }

/* ========== 移动端（侧栏滑出抽屉） ========== */
#scrim { display: none; }
@media (max-width: 720px) {
  #sidebar {
    position: sticky; top: 48px;

  }

  .side-modes .mode { font-size: 10.5px; padding: 5px 0; }

  /* 手机端目录胶囊 ≤ 3×2cm（96×72px） */

  }

  .home-list { width: 100%; }
  .view h1.hero { font-size: 20px; }
  .view .hero-sub { font-size: 12px; margin-bottom: 18px; }
  .home-item { grid-template-columns: 1fr; }
  .home-item .hi-cover { height: 168px; min-height: 0; }
  .home-item .hi-body { padding: 14px 16px; gap: 7px; }
  .home-item .hi-title { font-size: 17px; }
  .home-item .hi-excerpt { font-size: 12px; -webkit-line-clamp: 2; }

  .view { padding: 20px 16px 32px; }

  .pg-btn { min-width: 32px; height: 32px; padding: 0 9px; font-size: 12px; }

}

/* 壁纸层与极光背景的关系
   ------------------------------------------------------------------
   页面背景由两层叠成：
     body          —— 底下的颜色/极光渐变（aurora-frost 里用 !important 写死）
     #wallpaper    —— 壁纸层，z-index 更低但盖在 body 背景之上
   app.js 的 applyWall() 用内联样式给 #wallpaper 设 backgroundImage。

   原来这里有一行 `#wallpaper{background-image:none;}`，
   把壁纸整个禁用了（改用极光当桌面背景），结果壁纸选择器点了没反应。
   现在恢复壁纸可用：选了带图的壁纸时给 body 加 .has-wall，
   让极光那层 !important 的渐变全透明，壁纸才露得出来。
   选「纯色」时没有 .has-wall，仍然显示极光。 */
#wall-shade{background:transparent !important;}

body.has-wall,
body.has-wall:not(.dark){
  background:transparent !important;
  background-image:none !important;
}

/* Mobile: compact topbar + admin link in flow */

#tb-brand{min-width:0;flex:0 1 auto}

#tb-tabs{flex:1 1 auto;min-width:0}

.tb-admin{background:linear-gradient(135deg,#38bdf8,#a855f7);color:#081018;text-decoration:none;padding:6px 12px;border-radius:999px;font-weight:700;white-space:nowrap;box-shadow:0 4px 14px rgba(56,189,248,.4);transition:transform .15s;margin-left:auto}
.tb-admin:hover{transform:translateY(-1px)}
@media (max-width:520px){#tb-brand .brand-text{font-size:13px}#tb-tabs button{font-size:12px;padding:3px 6px}.tb-admin{font-size:12px;padding:5px 9px}}

/* tighter topbar so 主页/归档/简介 all fit */

@media (max-width:520px){#tb-brand .brand-text{font-size:12px;max-width:84px}#tb-tabs{gap:6px}#tb-tabs button{font-size:12px;padding:3px 5px}.tb-admin{font-size:11px;padding:5px 8px}}
/* UI 精修：卡片/正文/间距 */
.pill{background:linear-gradient(150deg,rgba(255,255,255,.12),rgba(255,255,255,.05)) !important;}
.pill::before{background:radial-gradient(circle,rgba(125,211,252,.45),transparent 70%) !important;}
.reader-head,.md-body,#r-body{max-width:920px;margin-left:auto;margin-right:auto;width:100%;}
#r-body{line-height:1.85;font-size:15px;letter-spacing:.01em;}
#r-body img{max-width:100%;border-radius:14px;}
.home-card,.about-card{transition:transform .25s,box-shadow .25s;}

<style id="reading-enhance">
/* ==========================================================================
   阅读增强：进度条 / 目录 / 代码高亮 / 正文排版 / 图片灯箱
   --------------------------------------------------------------------------
   这一块放在最后，优先级高于 aurora-frost，所以不需要 !important 也能盖住。
   设计尺度统一走 :root 里的 --sp-* / --radius-* / --dur-* 变量。
   ========================================================================== */

/* ---------- 顶部阅读进度条 ---------- */
#read-progress {
  position: fixed; top: 0; left: 0;
  height: 2px; width: 0;
  background: var(--accent);
  z-index: 9999;
  transition: width .08s linear, opacity var(--dur) var(--ease);
  opacity: 0;
  pointer-events: none;
}
#read-progress.on { opacity: 1; }

/* ---------- 正文排版 ---------- */
/* 行宽限制：中文一行 30-40 字最舒服。原来 max-width 920px 配 16.5px 字，
   一行能塞 50+ 字，读起来眼睛容易串行。 */
#r-body {
  max-width: var(--reading-width);
  margin-left: auto;
  margin-right: auto;
}
.md-body {
  line-height: 1.9;          /* 原来是 2.05，偏松，段落之间显得散 */
  font-size: 16.5px;
  letter-spacing: .01em;
  text-wrap: pretty;         /* 避免最后一行只剩一两个字 */
}
.md-body p { margin: 1em 0; }
.md-body > p:first-of-type { margin-top: 0; }
.md-body h1, .md-body h2, .md-body h3, .md-body h4 {
  text-wrap: balance;        /* 标题尽量不折成孤字 */
  letter-spacing: -.01em;
  scroll-margin-top: 80px;
}
/* 标题锚点（hover 时出现 §） */
.md-body h2, .md-body h3 { position: relative; }
.md-body .h-anchor {
  position: absolute;
  left: -.72em;
  color: var(--text-faint);
  text-decoration: none;
  opacity: 0;
  transition: opacity var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  font-weight: 400;
}
.md-body h2:hover .h-anchor,
.md-body h3:hover .h-anchor,
.md-body .h-anchor:focus-visible { opacity: 1; }
.md-body .h-anchor:hover { color: var(--accent); }
@media (max-width: 720px) { .md-body .h-anchor { display: none; } }

/* ---------- 目录 ---------- */
.toc {
  max-width: var(--reading-width);
  margin: 0 auto var(--sp-5);
  padding: var(--sp-4) var(--sp-5);
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-l);
  box-shadow: var(--shadow-s);
  backdrop-filter: blur(16px) saturate(150%);
  -webkit-backdrop-filter: blur(16px) saturate(150%);
}
.toc .toc-head {
  display: flex; align-items: center; gap: var(--sp-2);
  font-size: 12.5px; font-weight: 600;
  letter-spacing: .04em;
  color: var(--text-soft);
  text-transform: uppercase;
  margin-bottom: var(--sp-3);
  user-select: none;
}
.toc ol { list-style: none; margin: 0; padding: 0; }
.toc li { margin: 0; }
.toc a {
  display: block;
  padding: 5px var(--sp-3);
  margin-left: calc(var(--sp-3) * -1);
  border-radius: var(--radius-s);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text-soft);
  text-decoration: none;
  border-left: 2px solid transparent;
  transition: color var(--dur-fast) var(--ease),
              background var(--dur-fast) var(--ease),
              border-color var(--dur-fast) var(--ease);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.toc a:hover { color: var(--text); background: var(--pill-hover); }
.toc a.active {
  color: var(--accent);
  border-left-color: var(--accent);
  background: var(--accent-soft);
  font-weight: 500;
}
.toc .lv-3 { padding-left: calc(var(--sp-3) + var(--sp-4)); font-size: 13.5px; }

}

/* ---------- 代码高亮 ---------- */
.md-body pre {
  position: relative;
  background: var(--code-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-m);
  padding: var(--sp-4);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.md-body pre code {
  background: none; padding: 0; border: 0;
  font-family: var(--font-mono);
  font-size: 13.5px;
  line-height: 1.7;
  color: inherit;
}

.md-body pre[data-lang]::before {
  content: attr(data-lang);
  position: absolute; top: 0; left: 0;
  padding: 3px 10px 4px;
  font-family: var(--font-mono);
  font-size: 10.5px; letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--text-faint);
  background: var(--card-border);
  border-radius: var(--radius-m) 0 var(--radius-m) 0;
  pointer-events: none;
}
.md-body pre[data-lang] { padding-top: calc(var(--sp-4) + 6px); }

/* 高亮 token */
.tok-comment { color: var(--code-comment); font-style: italic; }
.tok-keyword { color: var(--code-keyword); }
.tok-string  { color: var(--code-string); }
.tok-number  { color: var(--code-number); }
.tok-func    { color: var(--code-func); }
.tok-type    { color: var(--code-keyword); }
.tok-punct   { color: var(--text-faint); }

/* 行内代码 */
.md-body :not(pre) > code {
  font-family: var(--font-mono);
  font-size: .88em;
  padding: .16em .42em;
  border-radius: var(--radius-s);
  background: var(--code-bg);
  color: var(--accent);
  word-break: break-word;
}

/* 复制按钮：原来只有文字，改成右上角小胶囊 */
.md-body pre .code-copy {
  position: absolute; top: var(--sp-2); right: var(--sp-2);

  font-size: 11.5px; font-weight: 500;
  font-family: var(--font);
  color: var(--text-soft);
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-pill);

  opacity: 0;

.md-body pre:hover .code-copy,
.md-body pre .code-copy:focus-visible { opacity: 1; }
.md-body pre .code-copy:hover { color: var(--accent); }
@media (pointer: coarse) {

  .md-body pre .code-copy { opacity: .85; }
}

/* ---------- 图片：圆角 + 灯箱 ---------- */
.md-body img {
  display: block;
  max-width: 100%;
  height: auto;
  margin: var(--sp-5) auto;
  border-radius: var(--radius-m);
  box-shadow: var(--shadow-m);
  cursor: zoom-in;
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.md-body img:hover { transform: scale(1.006); box-shadow: var(--shadow-l); }

#lightbox {
  position: fixed; inset: 0; z-index: 9998;
  display: none;
  align-items: center; justify-content: center;
  padding: var(--sp-5);
  background: rgba(0,0,0,.82);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  cursor: zoom-out;
  animation: lb-in var(--dur) var(--ease);
}
#lightbox.on { display: flex; }
#lightbox img {
  max-width: 100%; max-height: 100%;
  border-radius: var(--radius-m);
  box-shadow: 0 24px 80px rgba(0,0,0,.6);
  cursor: default;
}
@keyframes lb-in { from { opacity: 0; } to { opacity: 1; } }

/* ---------- 首页卡片与顶栏交互 ---------- */
/* 卡片：hover 时轻微抬起 + 边框高亮，用统一的缓动和时长 */
.pill, .home-card, .home-item, .about-card {
  transition: transform var(--dur) var(--ease),
              box-shadow var(--dur) var(--ease),
              background var(--dur) var(--ease),
              border-color var(--dur) var(--ease) !important;
  will-change: transform;
}

  }
  /* 卡片左侧强调条：hover 时从中间滑出 */
  .home-item { position: relative; }
  .home-item::after {
    content: "";
    position: absolute; left: 0; top: 50%;
    width: 3px; height: 0;
    background: var(--accent);
    border-radius: var(--radius-pill);
    transform: translateY(-50%);
    transition: height var(--dur) var(--ease);
    pointer-events: none;
  }
  .home-item:hover::after { height: 46%; }

/* 顶栏：滚动后加深，配合已有的 .scrolled */
.menubar, .taskbar, .top-bar, #taskbar, #menubar {

/* ---------- 回到顶部按钮 ---------- */
#to-top {
  position: fixed; right: var(--sp-5); bottom: var(--sp-5);
  width: 40px; height: 40px;
  display: grid; place-items: center;
  font-size: 16px;
  color: var(--text-soft);

  border: 1px solid var(--card-border);

  backdrop-filter: blur(16px) saturate(150%);
  -webkit-backdrop-filter: blur(16px) saturate(150%);

  opacity: 0; pointer-events: none;
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease),
              color var(--dur-fast) var(--ease);

   --------------------------------------------------------------------------

     左栏 = 置顶/最新文章大卡（封面图 + 标签 + 标题 + 简介 + 统计）
     右栏 = 作者卡片 + 最新更新列表 + 站内链接
