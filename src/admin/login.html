<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>登录 · JerryHang 博客后台</title>
<style>
/* 公共样式由服务端在编译期内联进来，见 server.rs 的 login_page()。
   不能引用 /_admin/admin.css —— 那个路径需要已登录才能访问，
   未登录请求会被 302 回登录页，浏览器拿到的是 HTML 而不是 CSS。 */
/*__CSS__*/
</style>
<style>
/* 登录页专用布局 —— 瑞士国际主义平面风格 */
body.login {
  display: grid;
  place-items: center;
  padding: 24px;
  background: var(--bg);
  min-height: 100vh;
}

body.login::before {
  display: none !important;
}

.login-card {
  position: relative; z-index: 1;
  width: min(400px, 100%);
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 0px !important;
  box-shadow: none !important;
  padding: 44px 36px 40px;
}

.login-card .brand {
  width: 44px; height: 44px;
  border-radius: 0px !important;
  background: var(--accent);
  color: #fff;
  font-family: var(--font);
  font-size: 22px; font-weight: 700;
  display: grid; place-items: center;
  margin: 0 auto 18px;
  border: 1px solid var(--accent);
  box-shadow: none !important;
}

.login-card h1 {
  font-family: var(--font);
  font-size: 20px; font-weight: 700;
  text-align: center; margin: 0 0 4px;
  letter-spacing: -0.02em;
  text-transform: uppercase;
  color: var(--fg);
}
.login-card .hint {
  font-family: var(--font);
  font-size: 11px; font-weight: 600;
  color: var(--fg-2);
  text-align: center; margin: 0 0 26px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.login-card .field { margin-bottom: 16px; }
.login-card .field label {
  display: block;
  font-family: var(--font);
  font-size: 11px; font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--fg-2);
  margin-bottom: 6px;
}
.login-card .input {
  width: 100%;
  padding: 12px 14px;
  font-size: 14px;
  font-family: var(--font);
  border-radius: 0px !important;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--fg);
  outline: none;
  transition: border-color .15s ease;
}
.login-card .input:focus {
  border-color: var(--fg);
  background: var(--bg-elevated);
  box-shadow: none;
}

.login-card .btn.primary {
  width: 100%;
  padding: 12px;
  font-family: var(--font);
  font-size: 13px; font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border-radius: 0px !important;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: #fff;
  margin-top: 8px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  cursor: pointer;
  transition: background .15s ease, border-color .15s ease;
}
.login-card .btn.primary:hover {
  background: #cc0000;
  border-color: #cc0000;
}

.err {
  font-family: var(--font);
  font-size: 12px;
  font-weight: 500;
  color: var(--red);
  background: var(--red-soft);
  border: 1px solid var(--red);
  border-radius: 0px !important;
  padding: 10px 14px;
  margin-bottom: 16px;
  display: none;
}
.err.show { display: block; animation: shake .3s; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25%     { transform: translateX(-4px); }
  75%     { transform: translateX(4px); }
}

/* 加载指示 */
.spin {
  width: 14px; height: 14px;
  border: 2px solid rgba(255,255,255,.35);
  border-top-color: #fff;
  border-radius: 0px !important;
  animation: rot .7s linear infinite;
  display: none;
}
@keyframes rot { to { transform: rotate(360deg); } }
.btn.loading .spin { display: block; }
.btn.loading .label { opacity: .75; }

.login-foot {
  margin-top: 26px;
  text-align: center;
  font-size: 12px; font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--fg-3);
}
.login-foot a { color: var(--fg-2); text-decoration: none; transition: color .15s ease; }
.login-foot a:hover { color: var(--accent); }
</style>
</head>
<body class="login">

<form class="login-card" id="f" autocomplete="on">
  <div class="brand">J</div>
  <h1>博客后台</h1>
  <p class="hint">SWISS AUTHENTICATION · 凭证验证</p>

  <div class="err" id="err"></div>

  <!-- 用户名由服务端在渲染时注入，不在页面上暴露输入框：
       本站只有一个账号，让用户多打一遍用户名是多余的。
       隐藏字段同时保证密码管理器仍能正常工作。 -->
  <input type="hidden" id="u" name="username" value="__USERNAME__">

  <div class="field">
    <label for="p">管理员密码</label>
    <input class="input" id="p" name="password" type="password"
           autocomplete="current-password" required autofocus placeholder="输入密码以解锁管理权限">
  </div>

  <button class="btn primary" id="go" type="submit">
    <span class="spin"></span><span class="label">进入控制台 &rarr;</span>
  </button>

  <p class="login-foot">
    <a href="__PUBLIC_URL__">&larr; 返回博客前台</a>
  </p>
</form>

<script>
(function () {
  var f = document.getElementById('f');
  var u = document.getElementById('u');
  var p = document.getElementById('p');
  var go = document.getElementById('go');
  var err = document.getElementById('err');

  function showErr(msg) {
    err.textContent = msg;
    err.classList.add('show');
  }

  f.addEventListener('submit', async function (e) {
    e.preventDefault();
    err.classList.remove('show');

    if (!p.value) {
      showErr('请输入密码');
      return;
    }

    go.classList.add('loading');
    go.disabled = true;

    try {
      var r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u.value, password: p.value })
      });
      var d = {};
      try { d = await r.json(); } catch (_) {}

      if (r.ok && d.ok) {
        // 会话 cookie 已由服务端下发，按访问端环境进后台
        var target = (location.pathname.indexOf('/admin') >= 0 || location.search.indexOf('ref=admin') >= 0 || (location.port !== '8091' && location.port !== '8081')) ? '/admin' : '/';
        location.replace(target);
        return;
      }
      showErr(d.error || (r.status === 401 ? '密码不正确' : '登录失败（HTTP ' + r.status + '）'));
    } catch (_) {
      showErr('无法连接服务，请确认博客服务正在运行');
    }

    go.classList.remove('loading');
    go.disabled = false;
    p.value = '';
    p.focus();
  });
})();
</script>
</body>
</html>
